<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reaction rate lab · Dr. NAM</title>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;800&family=Questrial&display=swap" rel="stylesheet">
<style>
:root{--bg:#081426;--panel:#0f2340;--panel2:#13304f;--ink:#e3eef8;--muted:#9fb6c8;--teal:#2dd4bf;--lime:#d4ff3a;--hot:#fc7a7a;--gold:#ffc861;--edge:rgba(111,214,200,.35)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Questrial,system-ui,sans-serif;overflow:hidden}
sub,sup{font-size:.68em;line-height:0}
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100%;padding:10px;gap:8px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:8px;flex:1;min-width:280px}
.tabs button{flex:1;border:1px solid var(--edge);background:var(--panel);color:var(--ink);padding:9px 6px;border-radius:12px;font:700 17px 'League Spartan',sans-serif;cursor:pointer}
.tabs button.on{background:var(--teal);color:#062a2b;border-color:var(--teal)}
.eq{font-size:17px;padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--edge);white-space:nowrap}
.eq b{color:var(--lime)}
.main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:8px;min-height:0}
.box{background:radial-gradient(120% 90% at 70% 0%,#12385a 0%,#0b1c33 70%);border:1px solid var(--edge);border-radius:16px;padding:10px 12px;min-height:0;display:flex;flex-direction:column;gap:6px}
.h{margin:0;font:800 15px 'League Spartan',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--teal)}
.scene{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:8px;flex:1;min-height:0}
.cv{position:relative;min-height:0}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chip{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:6px 10px}
.chip span{display:block;font-size:13px;color:var(--muted)}
.chip b{font:800 22px 'League Spartan',sans-serif;color:var(--gold)}
.chip b small{font-size:.6em}
.bottom{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:8px}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 16px;align-items:center}
.row{display:flex;justify-content:space-between;align-items:baseline;font:800 17px 'League Spartan',sans-serif}
.row output{color:var(--gold)}
input[type=range]{width:100%;margin:0;accent-color:var(--gold);height:26px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--edge);background:var(--panel2);color:var(--ink);border-radius:10px;padding:6px 4px;font:700 15px 'League Spartan',sans-serif;cursor:pointer}
.seg button.on{background:var(--gold);color:#2a1a00;border-color:var(--gold)}
.btns{grid-column:1/-1;display:flex;gap:8px;margin-top:4px}
.btns button{flex:1;border:0;border-radius:12px;padding:10px;font:800 18px 'League Spartan',sans-serif;cursor:pointer}
.go{background:var(--lime);color:#0a1628}
.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--edge)!important}
.why{font-size:16px;line-height:1.4;overflow:auto}
.why b{color:var(--lime)}
.why p{margin:0 0 5px}
.calc{font-size:14px;color:var(--muted);margin-top:auto}
[hidden]{display:none!important}
@media (max-width:820px){html,body{overflow:auto;height:auto}#app{height:auto}.main,.bottom{grid-template-columns:1fr}.scene{grid-template-columns:1fr}.cv.app{height:240px}.cv.zoom{height:220px}.cv.graph{height:230px;flex:none!important}.ctl{grid-template-columns:1fr}.eq{white-space:normal}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="tabs"><button data-m="marble" class="on">🪨 Marble + acid</button><button data-m="h2o2">🫧 Hydrogen peroxide + catalyst</button></div>
    <div class="eq" id="eq"></div>
  </div>

  <div class="main">
    <div class="box">
      <p class="h">Watch the reaction</p>
      <div class="scene">
        <div class="cv app"><canvas id="cApp"></canvas></div>
        <div class="cv zoom"><canvas id="cZoom"></canvas></div>
      </div>
    </div>
    <div class="box">
      <p class="h">Volume of gas vs time</p>
      <div class="chips">
        <div class="chip"><span>Gas collected</span><b id="rV">0 <small>cm³</small></b></div>
        <div class="chip"><span>Time</span><b id="rT">0 <small>s</small></b></div>
        <div class="chip"><span>Average rate, 0–60 s</span><b id="rR">… </b></div>
      </div>
      <div class="cv graph" style="flex:1"><canvas id="cGraph"></canvas></div>
    </div>
  </div>

  <div class="bottom">
    <div class="box">
      <div class="ctl">
        <div><div class="row">🌡️ Temperature <output id="oT"></output></div><input type="range" id="sT" min="15" max="65" step="5" value="25" aria-label="Temperature"></div>
        <div id="wC"><div class="row">🧪 Acid concentration <output id="oC"></output></div><input type="range" id="sC" min="0.5" max="2" step="0.25" value="1" aria-label="Acid concentration"></div>
        <div id="wS" style="grid-column:1/-1"><div class="row" style="margin-bottom:4px">🪨 Size of marble pieces</div><div class="seg" id="segS"><button data-v="lumps">Big lumps</button><button data-v="chips" class="on">Small chips</button><button data-v="powder">Powder</button></div></div>
        <div id="wK" style="grid-column:1/-1" hidden><div class="row" style="margin-bottom:4px">🪑 Catalyst</div><div class="seg" id="segK"><button data-v="none" class="on">None</button><button data-v="mno2">MnO<sub>2</sub> powder</button><button data-v="enz">Catalase (enzyme)</button></div></div>
        <div class="btns"><button class="go" id="bGo">▶ Start</button><button class="ghost" id="bReset">↺ Reset</button><button class="ghost" id="bClear">🧹 Clear old lines</button></div>
      </div>
    </div>
    <div class="box">
      <p class="h">What is happening?</p>
      <div class="why" id="why"></div>
      <div class="calc" id="calc"></div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TMAX=300, YMAX=70, SPEED=10; // graph window (s), y axis (cm3), sim seconds per real second
const M={
 marble:{vmax:60,eq:'CaCO<sub>3</sub>(s) + 2HCl(aq) → CaCl<sub>2</sub>(aq) + H<sub>2</sub>O(l) + <b>CO<sub>2</sub>(g)</b>',
   calc:'0.25 g CaCO<sub>3</sub> = 0.0025 mol → 0.0025 mol CO<sub>2</sub> × 24 000 cm³/mol = <b>60 cm³</b> (room temperature). The acid is in excess, so the marble decides the total gas.',
   gas:'CO₂',liquid:'rgba(120,190,255,.30)'},
 h2o2:{vmax:53,eq:'2H<sub>2</sub>O<sub>2</sub>(aq) → 2H<sub>2</sub>O(l) + <b>O<sub>2</sub>(g)</b>',
   calc:'10 cm³ of 1.5% w/v H<sub>2</sub>O<sub>2</sub> = 0.15 g = 0.0044 mol → 0.0022 mol O<sub>2</sub> ≈ <b>53 cm³</b>. A catalyst is not used up, so the total gas stays the same.',
   gas:'O₂',liquid:'rgba(200,235,255,.22)'}
};
const S={m:'marble',T:25,C:1,size:'chips',cat:'none',t:0,run:false,ghosts:[],pts:[]};
const SZ={lumps:.4,chips:1,powder:3};
const two=T=>2**((T-25)/10);
function enzAct(T){return two(T)/(1+Math.exp((T-42)/3))}
// "energy factor": how many particles have enough energy (temperature + catalyst)
function eF(){if(S.m==='marble')return two(S.T);
  if(S.cat==='none')return .04*two(S.T);if(S.cat==='mno2')return 1.3*two(S.T);return 1.6*enzAct(S.T)}
function k(){if(S.m==='marble')return .01155*S.C*two(S.T)*SZ[S.size];
  if(S.cat==='none')return .0003*two(S.T);if(S.cat==='mno2')return .022*two(S.T);return .05*enzAct(S.T)}
const vmax=()=>M[S.m].vmax;
const V=t=>vmax()*(1-Math.exp(-k()*t));
const label=()=>S.m==='marble'?`${S.C.toFixed(2).replace(/0$/,'')} M · ${S.T} °C · ${({lumps:'lumps',chips:'chips',powder:'powder'})[S.size]}`:`${S.T} °C · ${({none:'no catalyst',mno2:'MnO₂',enz:'catalase'})[S.cat]}`;

// ---------- canvases
function setup(id){const c=$(id),x=c.getContext('2d');const o={c,x,w:0,h:0};
  const fit=()=>{const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);o.w=r.width;o.h=r.height;x.setTransform(d,0,0,d,0,0)};
  new ResizeObserver(fit).observe(c.parentElement);fit();return o}
const A=setup('cApp'),Z=setup('cZoom'),G=setup('cGraph');

// ---------- apparatus scene (virtual 600 x 340)
let bubbles=[],pieces=[];
function makePieces(){const r=[];let n,rad;
  if(S.m==='marble'){[n,rad]={lumps:[2,17],chips:[8,7],powder:[60,2.2]}[S.size];
    for(let i=0;i<n;i++)r.push({x:S.size==='lumps'?118+i*42:72+Math.random()*136,y:S.size==='lumps'?272:284-Math.random()*(S.size==='powder'?10:6),r:rad*(.8+Math.random()*.4),c:'#eef2f6'})}
  else if(S.cat==='mno2')for(let i=0;i<45;i++)r.push({x:72+Math.random()*136,y:286-Math.random()*8,r:2,c:'#1a1a1a'});
  else if(S.cat==='enz')for(let i=0;i<3;i++)r.push({x:100+i*40,y:280,r:13,c:'#f1d79a',disc:1});
  pieces=r}
function flaskX(y){const t=(y-110)/180;return [120-80*t,160+80*t]}
function bathColor(T){const f=(T-15)/50;return `rgba(${Math.round(60+195*f)},${Math.round(150-40*f)},${Math.round(255-200*f)},.28)`}
function drawApp(v,rate,dt){const {x,w,h}=A;x.clearRect(0,0,w,h);
  const s=Math.min(w/600,h/330);x.save();x.translate((w-600*s)/2,(h-330*s)/2);x.scale(s,s);
  // water bath
  x.fillStyle=bathColor(S.T);x.beginPath();x.roundRect(20,200,250,112,14);x.fill();
  x.fillStyle='#cfe3f2';x.font='700 15px "League Spartan",sans-serif';x.fillText(`Water bath ${S.T} °C`,30,328);
  // liquid
  const ly=190,[l1,r1]=flaskX(ly);x.fillStyle=M[S.m].liquid;x.beginPath();x.moveTo(l1,ly);x.lineTo(r1,ly);x.lineTo(240,290);x.quadraticCurveTo(240,298,230,298);x.lineTo(50,298);x.quadraticCurveTo(40,298,40,290);x.closePath();x.fill();
  // solid / catalyst
  const shrink=S.m==='marble'?Math.cbrt(Math.max(0,1-v/vmax())):1;
  const dead=S.m==='h2o2'&&S.cat==='enz'&&S.T>=50;
  pieces.forEach(p=>{const r=p.r*shrink;if(r<.4)return;x.fillStyle=dead&&p.disc?'#9a9486':p.c;x.beginPath();
    if(p.disc)x.ellipse(p.x,p.y,r,r*.45,0,0,7);else x.arc(p.x,p.y,r,0,7);x.fill()});
  // bubbles
  if(S.run){let n=rate*dt*2.2;while(n>0){if(Math.random()<n){const p=pieces.length?pieces[Math.floor(Math.random()*pieces.length)]:{x:80+Math.random()*120,y:290};
      bubbles.push({x:p.x+(Math.random()-.5)*10,y:p.y-4,r:1.5+Math.random()*3,vy:40+Math.random()*50})}n--}}
  bubbles=bubbles.filter(b=>{if(S.run){b.y-=b.vy*dt;b.x+=Math.sin(b.y*.15)*.3}return b.y>ly});
  if(bubbles.length>260)bubbles.splice(0,bubbles.length-260);
  x.strokeStyle='rgba(255,255,255,.85)';x.lineWidth=1.3;bubbles.forEach(b=>{x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.stroke()});
  // flask glass
  x.strokeStyle='#bfe6ff';x.lineWidth=4;x.lineJoin='round';x.beginPath();x.moveTo(120,46);x.lineTo(120,110);x.lineTo(40,290);x.quadraticCurveTo(40,298,50,298);x.lineTo(230,298);x.quadraticCurveTo(240,298,240,290);x.lineTo(160,110);x.lineTo(160,46);x.stroke();
  // bung + tube
  x.fillStyle='#5b3b2a';x.fillRect(116,30,48,20);
  x.strokeStyle='#bfe6ff';x.lineWidth=5;x.beginPath();x.moveTo(140,32);x.lineTo(140,14);x.lineTo(305,14);x.lineTo(305,64);x.lineTo(332,64);x.stroke();
  // syringe
  const x0=340,x1=560,gx=x0+(x1-x0)*Math.min(v,100)/100;
  x.fillStyle='rgba(212,255,58,.22)';x.fillRect(x0,47,gx-x0,34);
  x.strokeStyle='#bfe6ff';x.lineWidth=3;x.strokeRect(332,44,240,40);
  x.fillStyle='#9fb6c8';x.font='12px Questrial,sans-serif';x.textAlign='center';
  for(let i=0;i<=100;i+=10){const tx=x0+(x1-x0)*i/100;x.fillRect(tx-.5,84,1,i%50?6:10);if(i%20===0)x.fillText(i,tx,104)}
  x.fillStyle='#e3eef8';x.fillRect(gx-3,45,6,38);x.fillRect(gx,61,600,6);
  x.font='700 16px "League Spartan",sans-serif';x.fillStyle='#d4ff3a';x.fillText(`${M[S.m].gas} gas: ${v.toFixed(1)} cm³`,450,32);
  x.fillStyle='#9fb6c8';x.font='13px Questrial,sans-serif';x.fillText('Gas syringe (cm³)',450,122);
  // little legend under flask
  x.textAlign='left';x.fillStyle='#9fb6c8';x.font='13px Questrial,sans-serif';
  x.fillText(S.m==='marble'?'Marble chips (CaCO₃) in hydrochloric acid':S.cat==='none'?'H₂O₂ solution, no catalyst':S.cat==='mno2'?'H₂O₂ + manganese(IV) oxide':dead?'Catalase is cooked (denatured)!':'H₂O₂ + catalase (from potato)',290,180);
  x.restore()}

// ---------- zoom view: collision theory
let parts=[],sparks=[],zb=[];
function newPart(top){return {x:Math.random(),y:top?.05+Math.random()*.1:.1+Math.random()*.6,a:Math.random()*6.283,e:-Math.log(Math.random()+1e-9)}}
function makeParts(){const n=S.m==='marble'?Math.round(6+S.C*12):20;while(parts.length<n)parts.push(newPart());parts.length=n}
function grains(){if(S.m==='marble'&&S.size==='powder')return [[.25,.5],[.7,.38],[.5,.66],[.15,.28],[.82,.62]];
  if(S.m==='h2o2'&&S.cat!=='none')return [[.3,.45],[.72,.55]];return []}
function surfSpan(){if(S.m==='marble'&&S.size==='lumps')return [.3,.7];if(S.m==='h2o2'&&S.cat==='none')return [0,0];return [0,1]}
function drawZoom(dt){const {x,w,h}=Z;x.clearRect(0,0,w,h);
  const R=Math.min(w,h-40)/2-4,cx=w/2,cy=R+4;if(R<20)return;
  const hot=1-Math.exp(-.18*eF()),thr=-Math.log(Math.max(1e-4,hot));
  const sp=(S.m==='marble'?.13:.11)*(.55+(S.T-15)/50*1.1);
  const done=S.m==='marble'&&V(S.t)>=vmax()*.995;
  x.save();x.beginPath();x.arc(cx,cy,R,0,7);x.clip();
  x.fillStyle='#0d2a48';x.fillRect(cx-R,cy-R,2*R,2*R);
  const fy=.84,[s0,s1]=surfSpan(),G=grains(),dead=S.m==='h2o2'&&S.cat==='enz'&&S.T>=50;
  const surfC=S.m==='marble'?'#e6ebf0':S.cat==='mno2'?'#2b2b2b':dead?'#9a9486':'#f1d79a';
  if(!done&&s1>s0){x.fillStyle=surfC;x.fillRect(cx-R+2*R*s0,cy-R+2*R*fy,2*R*(s1-s0),2*R*(1-fy))}
  if(S.m==='h2o2'&&S.cat==='none'){x.fillStyle='rgba(191,230,255,.35)';x.fillRect(cx-R,cy-R+2*R*.93,2*R,2*R*.07)}
  if(!done)G.forEach(g=>{x.fillStyle=surfC;x.beginPath();x.roundRect(cx-R+2*R*g[0]-R*.07,cy-R+2*R*g[1]-R*.05,R*.14,R*.1,3);x.fill()});
  const step=S.run?dt:0;
  parts.forEach(p=>{const v=sp*Math.sqrt(p.e+.3);p.x+=Math.cos(p.a)*v*step;p.y+=Math.sin(p.a)*v*step;
    let hit=false;
    if(p.x<.03||p.x>.97){p.a=Math.PI-p.a;p.x=Math.min(.97,Math.max(.03,p.x));p.e=-Math.log(Math.random()+1e-9)}
    if(p.y<.04){p.a=-p.a;p.y=.04}
    const floor=(S.m==='h2o2'&&S.cat==='none')?.92:fy-.02;
    if(p.y>floor){p.a=-p.a;p.y=floor;hit=!done&&((p.x>s0&&p.x<s1)||(S.m==='h2o2'&&S.cat==='none'))}
    G.forEach(g=>{if(!done&&Math.abs(p.x-g[0])<.08&&Math.abs(p.y-g[1])<.06){p.a+=Math.PI;p.x+=Math.cos(p.a)*.03;p.y+=Math.sin(p.a)*.03;hit=true}});
    if(hit&&S.run){if(p.e>thr){sparks.push({x:p.x,y:p.y,t:0});zb.push({x:p.x,y:p.y,r:2+Math.random()*2});Object.assign(p,newPart(true))}
      else sparks.push({x:p.x,y:p.y,t:0,miss:1})}
    const px=cx-R+2*R*p.x,py=cy-R+2*R*p.y,isHot=p.e>thr;
    if(isHot){x.fillStyle='rgba(212,255,58,.25)';x.beginPath();x.arc(px,py,R*.075,0,7);x.fill()}
    x.fillStyle=isHot?'#d4ff3a':(S.m==='marble'?'#fc7a7a':'#8fd3ff');x.beginPath();x.arc(px,py,R*.04,0,7);x.fill()});
  sparks=sparks.filter(s=>{s.t+=dt;const px=cx-R+2*R*s.x,py=cy-R+2*R*s.y,a=1-s.t/.45;if(a<=0)return false;
    if(s.miss){x.strokeStyle=`rgba(159,182,200,${a*.7})`;x.lineWidth=1.5;x.beginPath();x.arc(px,py,R*.06*(1+s.t*3),0,7);x.stroke()}
    else{x.strokeStyle=`rgba(255,200,97,${a})`;x.lineWidth=2;for(let i=0;i<8;i++){const an=i*.785,r1=R*.03,r2=R*(.07+s.t*.25);x.beginPath();x.moveTo(px+Math.cos(an)*r1,py+Math.sin(an)*r1);x.lineTo(px+Math.cos(an)*r2,py+Math.sin(an)*r2);x.stroke()}}
    return true});
  zb=zb.filter(b=>{if(S.run)b.y-=.25*dt;x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=1.2;x.beginPath();x.arc(cx-R+2*R*b.x,cy-R+2*R*b.y,b.r,0,7);x.stroke();return b.y>0});
  if(done){x.fillStyle='rgba(8,20,38,.6)';x.fillRect(cx-R,cy-R,2*R,2*R);x.fillStyle='#d4ff3a';x.font='800 16px "League Spartan",sans-serif';x.textAlign='center';x.fillText('All marble used up!',cx,cy)}
  x.restore();
  x.strokeStyle='#2dd4bf';x.lineWidth=3;x.beginPath();x.arc(cx,cy,R,0,7);x.stroke();
  x.textAlign='center';x.font='12px Questrial,sans-serif';x.fillStyle='#9fb6c8';
  x.fillText('Zoom in: particles',cx,cy+R+15);
  x.fillStyle=S.m==='marble'?'#fc7a7a':'#8fd3ff';const nm=S.m==='marble'?'acid':'H₂O₂';
  x.fillText(`● ${nm}   `,cx-58,cy+R+31);x.fillStyle='#d4ff3a';x.fillText('● enough energy',cx+2,cy+R+31);x.fillStyle='#ffc861';x.fillText('✦ react',cx+70,cy+R+31)}

// ---------- graph
const GC=['#8fa3b5','#c49be0','#f0a38b'];
function drawGraph(){const {x,w,h}=G;x.clearRect(0,0,w,h);
  const L=44,Rr=12,T=14,B=34,pw=w-L-Rr,ph=h-T-B;if(pw<20||ph<20)return;
  const X=t=>L+pw*t/TMAX,Y=v=>T+ph*(1-v/YMAX);
  x.strokeStyle='rgba(159,182,200,.18)';x.lineWidth=1;x.fillStyle='#9fb6c8';x.font='12px Questrial,sans-serif';x.textAlign='right';
  for(let v=0;v<=YMAX;v+=10){x.beginPath();x.moveTo(L,Y(v));x.lineTo(L+pw,Y(v));x.stroke();x.fillText(v,L-6,Y(v)+4)}
  x.textAlign='center';for(let t=0;t<=TMAX;t+=60){x.fillText(t,X(t),T+ph+16)}
  x.fillText('Time (s)',L+pw/2,h-3);x.save();x.translate(12,T+ph/2);x.rotate(-Math.PI/2);x.fillText('Volume of gas (cm³)',0,0);x.restore();
  x.strokeStyle='#cfe3f2';x.lineWidth=1.5;x.beginPath();x.moveTo(L,T);x.lineTo(L,T+ph);x.lineTo(L+pw,T+ph);x.stroke();
  // max line
  x.setLineDash([5,5]);x.strokeStyle='rgba(212,255,58,.55)';x.beginPath();x.moveTo(L,Y(vmax()));x.lineTo(L+pw,Y(vmax()));x.stroke();x.setLineDash([]);
  x.fillStyle='rgba(212,255,58,.8)';x.textAlign='left';x.fillText(`most gas possible: ${vmax()} cm³`,L+6,Y(vmax())-5);
  // old runs
  S.ghosts.forEach((g,i)=>{if(g.m!==S.m)return;x.strokeStyle=GC[i%3];x.lineWidth=2;x.setLineDash([6,4]);x.beginPath();g.p.forEach((p,j)=>j?x.lineTo(X(p[0]),Y(p[1])):x.moveTo(X(p[0]),Y(p[1])));x.stroke();x.setLineDash([]);
    const e=g.p[g.p.length-1];x.fillStyle=GC[i%3];x.textAlign='right';x.fillText(g.lab,Math.min(X(e[0]),L+pw-2),Y(e[1])+(e[1]>vmax()-8?16:-6))});
  // current
  if(S.pts.length>1){x.save();x.shadowColor='#2dd4bf';x.shadowBlur=10;x.strokeStyle='#5ff0dc';x.lineWidth=3;x.beginPath();S.pts.forEach((p,j)=>j?x.lineTo(X(p[0]),Y(p[1])):x.moveTo(X(p[0]),Y(p[1])));x.stroke();x.restore()}
  const v=V(S.t);x.fillStyle='#ffc861';x.beginPath();x.arc(X(S.t),Y(v),5,0,7);x.fill();
  if(S.t>0){x.setLineDash([3,4]);x.strokeStyle='rgba(255,200,97,.6)';x.beginPath();x.moveTo(X(S.t),Y(v));x.lineTo(X(S.t),T+ph);x.stroke();x.setLineDash([])}}

// ---------- explanation
function explain(){const r=[],m=S.m;
  if(m==='marble'){
    if(S.C>1)r.push('<b>More concentrated acid:</b> more acid particles in the same space, like more people in the same room. They bump into the marble more often.');
    if(S.C<1)r.push('<b>More dilute acid:</b> fewer acid particles in the same space, so fewer collisions every second.');
    if(S.size==='powder')r.push('<b>Powder:</b> much more surface. More acid particles can hit the marble at the same time.');
    if(S.size==='lumps')r.push('<b>Big lumps:</b> only the outside can react. Less surface means fewer collisions.');
  }else{
    if(S.cat==='none')r.push('<b>No catalyst:</b> the energy hill (E<sub>a</sub>) is high. Almost no particles have enough energy, so you see very little gas.');
    if(S.cat==='mno2')r.push('<b>MnO<sub>2</sub> catalyst:</b> it gives an easier path with a lower E<sub>a</sub>, like a chair that lets you rest. Many more collisions work. The MnO<sub>2</sub> is not used up.');
    if(S.cat==='enz'&&S.T<50)r.push('<b>Catalase:</b> an enzyme (a body catalyst) that breaks down H<sub>2</sub>O<sub>2</sub>. It works best near <b>37 °C</b>, our body temperature.');
    if(S.cat==='enz'&&S.T>=50)r.push('<b>Too hot!</b> The enzyme changes shape (denatures), like a cooked egg. It cannot work any more, so the rate falls.');
  }
  if(!(m==='h2o2'&&S.cat==='enz'&&S.T>=50)){
    if(S.T>25)r.push('<b>Hotter:</b> particles move faster. They collide more often, and more of them have enough energy to react (glowing ones).');
    if(S.T<25)r.push('<b>Colder:</b> particles move slower and fewer have enough energy. This is why we keep some medicines in the fridge.');
  }
  if(!r.length)r.push(m==='marble'?'This is the <b>standard run</b>: 1 M acid, 25 °C, small chips. Press <b>Start</b>, then change one thing and compare the lines.':'Press <b>Start</b>. Then try a catalyst and compare the lines.');
  const kk=k(),v60=V(60);
  r.push(`Rate now: about <b>${(kk*vmax()).toFixed(2)} cm³/s</b> at the start. The total gas stays <b>${vmax()} cm³</b>, only the speed changes.`);
  $('why').innerHTML=r.map(s=>`<p>${s}</p>`).join('');$('calc').innerHTML=M[S.m].calc}

// ---------- controls
function saveGhost(){if(S.pts.length>3){S.ghosts.push({m:S.m,lab:S.lab,p:S.pts.slice()});if(S.ghosts.length>3)S.ghosts.shift()}}
function reset(keep=true){if(keep)saveGhost();S.t=0;S.fin=0;S.pts=[[0,0]];S.run=false;S.lab=label();bubbles=[];sparks=[];zb=[];makePieces();makeParts();$('bGo').textContent='▶ Start';ui()}
function ui(){$('oT').textContent=S.T+' °C';$('oC').textContent=S.C.toFixed(2)+' mol dm⁻³';
  $('wC').hidden=$('wS').hidden=S.m!=='marble';$('wK').hidden=S.m!=='h2o2';$('eq').innerHTML=M[S.m].eq;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.m));
  document.querySelectorAll('#segS button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.size));
  document.querySelectorAll('#segK button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.cat));explain()}
$('sT').oninput=e=>{S.T=+e.target.value;reset()};
$('sC').oninput=e=>{S.C=+e.target.value;reset()};
$('segS').onclick=e=>{const b=e.target.closest('button');if(b){S.size=b.dataset.v;reset()}};
$('segK').onclick=e=>{const b=e.target.closest('button');if(b){S.cat=b.dataset.v;reset()}};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{if(S.m===b.dataset.m)return;saveGhost();S.m=b.dataset.m;reset(false)});
$('bGo').onclick=()=>{if(S.fin)reset();S.run=!S.run;$('bGo').textContent=S.run?'⏸ Pause':'▶ Start'};
$('bReset').onclick=()=>reset();
$('bClear').onclick=()=>{S.ghosts=[];drawGraph()};

// ---------- loop
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S.run){S.t=Math.min(TMAX,S.t+dt*SPEED);S.pts.push([S.t,V(S.t)]);if(S.t>=TMAX||(S.t>=60&&V(S.t)>=vmax()*.998)){S.run=false;S.t=Math.max(S.t,0);S.fin=1;$('bGo').textContent='↺ Run again'}}
  const v=V(S.t),rate=k()*(vmax()-v);
  $('rV').innerHTML=`${v.toFixed(1)} <small>cm³</small>`;$('rT').innerHTML=`${Math.round(S.t)} <small>s</small>`;
  $('rR').innerHTML=S.t>=60?`${(V(60)/60).toFixed(2)} <small>cm³/s</small>`:'… ';
  drawApp(v,rate,dt*(RM?.4:1));drawZoom(dt*(RM?.4:1));drawGraph();requestAnimationFrame(loop)}

const q=new URLSearchParams(location.search).get('mode');if(q==='h2o2')S.m='h2o2';
$('sT').value=S.T;$('sC').value=S.C;reset(false);requestAnimationFrame(loop);

addEventListener('keydown',e=>{const t=e.target.tagName;if(t==='INPUT')return;
  const map={ArrowRight:'next',PageDown:'next',ArrowLeft:'prev',PageUp:'prev'};
  if(map[e.key]&&parent!==window){e.preventDefault();parent.postMessage({simkey:map[e.key]},'*')}});
</script>
