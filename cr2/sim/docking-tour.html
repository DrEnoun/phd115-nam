<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docking tour: imatinib meets its enzyme · Dr. NAM</title>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;800&family=Questrial&display=swap" rel="stylesheet">
<script src="../../js/3Dmol-min.js"></script>
<style>
:root{--bg:#061427;--ink:#eaf4fb;--muted:#a9c2d4;--lime:#d4ff3a;--gold:#ffd27a;--org:#ffa24c;--teal:#7fe6d8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--ink);font-family:Questrial,system-ui,sans-serif;overflow:hidden;background:var(--bg)}
button{font-family:'League Spartan',system-ui,sans-serif;cursor:pointer}
#app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:8px;padding:10px}
.bar{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.bar h1{margin:0;font:800 22px 'League Spartan',sans-serif}.bar h1 span{color:var(--lime);text-shadow:0 0 16px rgba(212,255,58,.45)}
.bar p{margin:0;color:var(--muted);font-size:14px}
.pill{flex:none;border-radius:999px;padding:4px 10px;font:700 12px 'League Spartan',sans-serif;color:#13240a;background:var(--lime)}
.view{position:relative;border-radius:22px;border:2px solid rgba(45,212,191,.4);background:#040d1c;box-shadow:0 12px 30px rgba(0,0,0,.45);overflow:hidden;min-height:0}
#mol{position:absolute;top:0;bottom:0;right:0;left:36%}
.lane{position:absolute;top:0;bottom:0;left:0;width:36%;background:linear-gradient(90deg,rgba(15,59,76,.35),rgba(4,13,28,0));pointer-events:none}
#wire{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font:700 16px 'League Spartan',sans-serif;z-index:4}
.hud{position:absolute;left:12px;top:10px;z-index:5;pointer-events:none;font:800 11.5px 'League Spartan',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.score{position:absolute;right:12px;top:10px;z-index:5;pointer-events:none;border-radius:14px;padding:6px 12px;background:rgba(6,15,31,.78);border:1px solid rgba(212,255,58,.5);text-align:right;opacity:0;transition:opacity .4s}
.score span{display:block;font-size:11.5px;color:var(--muted)}.score b{font:800 24px 'League Spartan',sans-serif;color:var(--lime)}
.score.on{opacity:1}
/* speech bubble */
#bub{position:absolute;z-index:6;width:calc(36% - 24px);left:12px;border-radius:18px;padding:10px 14px 12px;background:#fffdf5;color:#14213d;box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:16.5px;line-height:1.38;pointer-events:none;opacity:0;transition:opacity .35s}
#bub.on{opacity:1}
#bub.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
#bub .who{display:flex;align-items:center;gap:6px;margin-bottom:3px;font:800 12.5px 'League Spartan',sans-serif;letter-spacing:.06em;text-transform:uppercase}
#bub .who img{width:24px;height:24px;border-radius:50%;object-fit:cover}
#bub .who i{font-style:normal;font-size:18px}
#bub b{color:#b5530d}
#dot{position:absolute;z-index:6;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 rgba(212,255,58,.7);animation:pulse 1.4s infinite;pointer-events:none;opacity:0}
#dot.on{opacity:1}
@keyframes pulse{70%{box-shadow:0 0 0 14px rgba(212,255,58,0)}100%{box-shadow:0 0 0 0 rgba(212,255,58,0)}}
.ctl{display:flex;align-items:center;gap:10px}
.ctl button{border-radius:14px;padding:9px 14px;font-weight:800;font-size:15px;border:0}
#bPlay{background:linear-gradient(180deg,#ffe27a,#ffab3a);color:#3a1600;min-width:110px}
.ctl button.g{background:rgba(255,255,255,.06);border:1px solid rgba(45,212,191,.35);color:var(--ink);min-width:44px}
.prog{flex:1;display:flex;gap:4px}
.prog i{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden;cursor:pointer;position:relative}
.prog i u{position:absolute;inset:0;width:0;background:var(--lime)}
.cap{font:700 12.5px 'League Spartan',sans-serif;color:var(--muted);white-space:nowrap}
@media (max-height:540px) and (min-width:700px){#app{padding:8px;gap:6px}.bar h1{font-size:18px}.bar p{display:none}.pill{font-size:10.5px}#bub{font-size:13.5px;padding:7px 11px 9px}.ctl button{padding:6px 10px;font-size:13px}.score b{font-size:18px}}
@media (max-width:700px){.bar{flex-direction:column;align-items:flex-start}.cap{display:none}#app{grid-template-rows:auto auto minmax(560px,1fr)}.ctl{flex-wrap:wrap}.prog{flex-basis:100%}html,body{overflow:auto;height:auto}
  #mol{left:0;bottom:42%}.lane{width:100%;top:58%;background:linear-gradient(0deg,rgba(15,59,76,.35),rgba(4,13,28,0))}#bub{width:auto;left:10px;right:10px;font-size:14.5px}}
/* surface view */
#glow{position:absolute;z-index:3;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .5s;mix-blend-mode:screen}
#glow.active{opacity:1;background:radial-gradient(circle,rgba(93,255,143,.75) 0%,rgba(93,255,143,.25) 40%,transparent 70%);animation:gpulse 1.4s ease-in-out infinite}
#glow.blocked{opacity:1;background:radial-gradient(circle,rgba(255,60,80,.7) 0%,rgba(255,60,80,.22) 40%,transparent 70%);animation:gpulse .9s ease-in-out infinite}
#glow.hit{opacity:1;background:radial-gradient(circle,rgba(255,40,60,.95) 0%,rgba(255,40,60,.4) 45%,transparent 75%);animation:none;transform:scale(1.35)}
@keyframes gpulse{0%,100%{transform:scale(.85)}50%{transform:scale(1.15)}}
#mol.shake{animation:shake .5s}
@keyframes shake{15%{transform:translate(-14px,5px) rotate(-1.2deg)}30%{transform:translate(12px,-6px) rotate(1deg)}45%{transform:translate(-10px,4px)}60%{transform:translate(8px,-3px)}75%{transform:translate(-4px,2px)}}
.flash{position:absolute;inset:0;z-index:4;pointer-events:none;background:rgba(255,40,60,.28);opacity:0}
.flash.on{animation:fl .5s}@keyframes fl{0%{opacity:1}100%{opacity:0}}
body.surface #bub{font-size:21px;line-height:1.35;padding:13px 17px 15px}
body.surface #bub .who{font-size:15px}body.surface #bub .who img{width:30px;height:30px}body.surface #bub .who i{font-size:22px}
body.surface .score b{font-size:30px}body.surface .score span{font-size:13.5px}
</style>
</head>
<body>
<div id="app">
  <div class="bar"><div><h1>Docking tour: <span>imatinib</span> meets its enzyme 🎬</h1><p>Sit back and watch. Real enzyme (PDB 1IEP), real AutoDock Vina docking results.</p></div><span class="pill">Computational chemistry</span></div>
  <div class="ctl"><button id="bPrev" class="g" title="Previous scene">⏮</button><button id="bPlay">⏸ Pause</button><button id="bNext" class="g" title="Next scene">⏭</button><button id="bSpd" class="g">1×</button><button id="bAgain" class="g">↺</button><div class="prog" id="prog"></div><span class="cap" id="cap">1 / 13</span></div>
  <div class="view">
    <div class="lane"></div><div id="mol"></div><svg id="wire"><path id="wpath" fill="none" stroke="#d4ff3a" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"/></svg><div class="loading" id="loading">Loading the enzyme… 🧬</div>
    <div class="hud">Abl kinase · PDB 1IEP</div>
    <div class="score" id="score"><span id="scoreLab"></span><b id="scoreVal"></b></div>
    <div id="glow"></div><div class="flash" id="flash"></div><div id="dot"></div>
    <div id="bub"><div class="who" id="who"></div><div id="say"></div></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const WHO={atp:['⚡','ATP (the real substrate)','#a2309c'],enzyme:['🧬','Abl kinase (the enzyme)','#0f7c6c'],drug:['💊','Imatinib (the drug)','#b5530d'],nam:['img','Dr. NAM','#5b3fd1']};
let speed=1,pocketView=null,atpM=null,ATP0=null,OUT=null,U1=null,U2=null,initView=null,D,V,rec,lig,xray=null,gridM=null,PS,playing=true,T=0,beat=-1,beatT0=0,tw=[],anchor=null;
/* ---------- helpers ---------- */
function coords(sdf){const L=sdf.split('\n'),n=parseInt(L[3].slice(0,3));const P=[];for(let i=0;i<n;i++){const l=L[4+i];P.push([+l.slice(0,10),+l.slice(10,20),+l.slice(20,30)])}return P}
const LIG=new URLSearchParams(location.search).get('view')==='surface'?{stick:{radius:.32,colorscheme:'orangeCarbon'},sphere:{scale:.3,colorscheme:'orangeCarbon'}}:{stick:{radius:.22,colorscheme:'orangeCarbon'},sphere:{scale:.22,colorscheme:'orangeCarbon'}};
function setLig(P){lig.selectedAtoms({}).forEach((a,i)=>{a.x=P[i][0];a.y=P[i][1];a.z=P[i][2]});lig.setStyle({},LIG)}
function ligCenter(){const A=lig.selectedAtoms({});let x=0,y=0,z=0;A.forEach(a=>{x+=a.x;y+=a.y;z+=a.z});return{x:x/A.length,y:y/A.length,z:z/A.length}}
function tween(dur,fn,done){tw.push({t0:T,dur,fn,done})}
function ease(k){return k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2}
function morph(A,B,dur,arc){tween(dur,k=>{const e=ease(k),l=arc?Math.sin(Math.PI*e)*arc:0;setLig(A.map((p,i)=>[p[0]+(B[i][0]-p[0])*e,p[1]+(B[i][1]-p[1])*e+l,p[2]+(B[i][2]-p[2])*e]))})}
function score(lab,val){if(!lab){$('score').classList.remove('on');return}$('scoreLab').textContent=lab;$('scoreVal').textContent=val;$('score').classList.add('on')}
function pocket(){return{chain:'A',resi:D.pocket.map(p=>p.num)}}
function showBox(on){V.removeAllShapes();if(gridM){V.removeModel(gridM);gridM=null}if(!on)return;
  const b=D.box,c=b.center,h=b.size.map(v=>v/2),C=[];for(const sx of[-1,1])for(const sy of[-1,1])for(const sz of[-1,1])C.push([c[0]+sx*h[0],c[1]+sy*h[1],c[2]+sz*h[2]]);
  [[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]].forEach(([i,j])=>V.addCylinder({start:{x:C[i][0],y:C[i][1],z:C[i][2]},end:{x:C[j][0],y:C[j][1],z:C[j][2]},radius:.09,color:'#7fe6d8',fromCap:1,toCap:1}));
  let xyz=[];for(let i=0;i<=5;i++)for(let j=0;j<=5;j++)for(let k=0;k<=5;k++)xyz.push(`He ${(c[0]-h[0]+i*4).toFixed(2)} ${(c[1]-h[1]+j*4).toFixed(2)} ${(c[2]-h[2]+k*4).toFixed(2)}`);
  gridM=V.addModel(xyz.length+'\ngrid\n'+xyz.join('\n'),'xyz');gridM.setStyle({},{sphere:{radius:.17,color:'#9ff3e8'}})}
function boxCorner(){const b=D.box,c=b.center,h=b.size.map(v=>v/2);return{x:c[0]+h[0],y:c[1]+h[1],z:c[2]-h[2]}}
function hbonds(on){V.removeAllShapes();V.removeAllLabels();if(!on)return;
  D.hbonds.forEach(h=>{V.addCylinder({start:{x:h.l[0],y:h.l[1],z:h.l[2]},end:{x:h.p[0],y:h.p[1],z:h.p[2]},radius:.1,dashed:true,dashLength:.25,gapLength:.2,color:'#ffe066',fromCap:1,toCap:1});
    V.addLabel(h.res,{position:{x:h.p[0],y:h.p[1],z:h.p[2]},backgroundColor:'#0b1a33',backgroundOpacity:.8,fontColor:'#ffe066',fontSize:11,inFront:true})})}
function setXray(on){if(xray){V.removeModel(xray);xray=null}if(on){xray=V.addModel(D.xray,'sdf');xray.setStyle({},{stick:{radius:.12,colorscheme:'greenCarbon'}})}}
function home(){if(initView)V.setView(initView);else{V.zoomTo();V.zoom(.95);initView=V.getView()}}
function ligTop(){const A=lig.selectedAtoms({});let t=A[0];A.forEach(a=>{if(a.y>t.y)t=a});return{x:t.x,y:t.y+5,z:t.z}}
function protCenter(){const c=D.center;return{x:c[0]-4,y:c[1]+14,z:c[2]}}
/* ---------- surface view ---------- */
const SURF=new URLSearchParams(location.search).get('view')==='surface';if(SURF)document.body.classList.add('surface');
let sBody=null,sPock=null,sState='';const SC={idle:['#a8d4ff','#ffd24a'],active:['#a8d4ff','#5dff8f'],blocked:['#a8d4ff','#ff4d5e'],off:['#7c8594','#9b2f3b']};
let sOp=1;function surfGlass(on){const o=on?.5:1;if(!SURF||sBody==null||o===sOp)return;sOp=o;V.setSurfaceMaterialStyle(sBody,{color:on?'#e6f3ff':SC[sState||'idle'][0],opacity:o});V.setSurfaceMaterialStyle(sPock,{color:on?'#ffe48a':SC[sState||'idle'][1],opacity:o})}
function surfState(st){if(!SURF||sState===st)return;sState=st;if(sBody!=null){V.setSurfaceMaterialStyle(sBody,{color:SC[st][0],opacity:sOp});V.setSurfaceMaterialStyle(sPock,{color:SC[st][1],opacity:sOp})}
  $('glow').className=st==='active'?'active':st==='blocked'?'blocked':''}
function surfHit(){const m=$('mol');m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake');const f=$('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');
  const g=$('glow');g.className='hit';setTimeout(()=>{if(sState==='blocked')g.className='blocked'},350)}
function buildSurf(){// cut a window over the pocket so the drug and ATP inside can be seen
  const out=D.atp.out,L=[].concat(...PS,ATP0),cut=[];
  rec.selectedAtoms({}).forEach(a=>{for(const l of L){const d=[a.x-l[0],a.y-l[1],a.z-l[2]],dep=d[0]*out[0]+d[1]*out[1]+d[2]*out[2];if(dep<0)continue;
    const lat=Math.hypot(d[0]-dep*out[0],d[1]-dep*out[1],d[2]-dep*out[2]);if(lat<5.5){cut.push(a.serial);break}}});
  const keep={not:{serial:cut}},pk=D.pocket.map(p=>p.num);
  return Promise.all([V.addSurface($3Dmol.SurfaceType.MS,{color:SC.idle[0]},{and:[keep,{not:{resi:pk}}]},keep),V.addSurface($3Dmol.SurfaceType.MS,{color:SC.idle[1]},{and:[keep,{resi:pk}]},keep)])
   .then(ids=>{sBody=ids[0];sPock=ids[1];sState='';surfState('idle')})}
function facePocket(z){const o=D.atp.out;let q=[o[1],-o[0],0,1+o[2]];const n=Math.hypot(...q);q=q.map(x=>x/n);const v=V.getView();v[4]=q[0];v[5]=q[1];v[6]=q[2];v[7]=q[3];V.setView(v);V.zoom(z)}
/* ---------- ATP helpers ---------- */
const ATPST={stick:{radius:.28,colorscheme:'magentaCarbon'},sphere:{scale:.28,colorscheme:'magentaCarbon'}};
function atpPlace(k,side){if(!atpM)return;const off=[OUT[0]*k+(side?side[0]:0),OUT[1]*k+(side?side[1]:0),OUT[2]*k+(side?side[2]:0)];
  atpM.selectedAtoms({}).forEach((a,i)=>{a.x=ATP0[i][0]+off[0];a.y=ATP0[i][1]+off[1];a.z=ATP0[i][2]+off[2]});atpM.setStyle({},ATPST)}
function atpHide(){if(atpM)atpM.setStyle({},{})}
function atpCenter(){const A=atpM.selectedAtoms({});let x=0,y=0,z=0;A.forEach(a=>{x+=a.x;y+=a.y;z+=a.z});return{x:x/A.length,y:y/A.length,z:z/A.length}}
function side(j){const a=j*2.1;return[U1[0]*Math.cos(a)*3+U2[0]*Math.sin(a)*3,U1[1]*Math.cos(a)*3+U2[1]*Math.sin(a)*3,U1[2]*Math.cos(a)*3+U2[2]*Math.sin(a)*3]}
function lab3d(txt,p,col,bg){V.addLabel(txt,{position:p,backgroundColor:bg||'#3a0b18',backgroundOpacity:.9,fontColor:col||'#ff9aa6',fontSize:15,inFront:true,borderColor:col||'#ff9aa6',borderThickness:1})}
/* ---------- the story (each beat: seconds, who, text, anchor, action) ---------- */
const spinY=(a,b)=>{if(!SURF)V.spin(a,b)};
const BEATS=[
 {s:7,who:'enzyme',at:()=>protCenter(),say:'Hi! I am <b>Abl kinase</b>, a real enzyme. This is my real 3D shape, found by X-ray crystallography. 🧬',go(){spinY('y',.5)}},
 {s:7.5,who:'enzyme',at:()=>protCenter(),say:'I am a <b>catalyst</b>. I move a phosphate group from ATP onto other proteins. In one blood cancer (CML), I am stuck <b>ON</b> 😵 Too much of a good thing! A medicine that <b>slows me down</b> would help.',go(){spinY('y',.5)}},
 {s:10,who:'atp',at:()=>atpCenter(),say:'I am <b>ATP</b>, the enzyme&#39;s <b>real substrate</b>. I slide into the <b>empty active site</b>… the enzyme takes one of my phosphate groups ⚡ That is the reaction it catalyses.',
  go(){atpPlace(20);tween(2600,k=>atpPlace(20*(1-ease(k))),()=>{lab3d('⚡ phosphate moved: reaction!',atpCenter(),'#d4ff3a','#13240a');score('Active site','Working ⚡');surfState('active')});
   tween(7200,k=>{if(k>.82){atpPlace(20*ease((k-.82)/.18));surfState('idle')}});score('Active site','Empty')}},
 {s:8,who:'nam',at:()=>boxCorner(),say:'This cyan cube is the <b>grid box</b> 📦 (20 × 20 × 20 Å). It is the search area around the <b>active site</b>. The computer only looks for poses inside it.',go(){score('Grid box','20 × 20 × 20 Å')}},
 {s:5.5,who:'drug',at:()=>ligCenter(),say:'Here I come! Let me try a pose… 🤔 <b>Pose 4: −11.1 kcal/mol</b>.',
  go(){const st=PS[3].map(p=>[p[0]+22,p[1]+16,p[2]-10]);setLig(st);morph(st,PS[3],2200,0);score('Pose 4 score','−11.1 kcal/mol')}},
 {s:4.2,who:'drug',at:()=>ligCenter(),say:'Twist and move… <b>Pose 3: −11.3</b>. Not my best yet.',go(){morph(PS[3],PS[2],1500,4);score('Pose 3 score','−11.3 kcal/mol')}},
 {s:4.2,who:'drug',at:()=>ligCenter(),say:'<b>Pose 2: −11.3</b>. Getting closer… 😊',go(){morph(PS[2],PS[1],1500,4);score('Pose 2 score','−11.3 kcal/mol')}},
 {s:6,who:'drug',at:()=>ligCenter(),say:'<b>Pose 1: −13.2 kcal/mol</b>. My best fit! 🎉 A more negative score means a better fit.',go(){surfGlass(true);tween(1500,()=>{},()=>{surfState('blocked');surfGlass(false)});morph(PS[1],PS[0],1500,2);score('Best pose','−13.2 kcal/mol')}},
 {s:8,who:'nam',at:()=>ligCenter(),say:'The <b style="color:#1f8f4c">thin green</b> sticks show where the real drug sits in the X-ray structure. The best pose is only <b>0.38 Å</b> away: smaller than one atom! ✅',go(){score('Best pose vs X-ray','0.38 Å')}},
 {s:8.5,who:'drug',at:()=>ligTop(),say:'I <b>hold hands</b> with the pocket in 6 places 🤝 These yellow dashes are <b>hydrogen bonds</b>. They keep me tightly in place.',go(){score('Hydrogen bonds','6')}},
 {s:12,who:'atp',at:()=>atpCenter(),say:'Let me in! I need the active site… ✗ <b>Blocked!</b> The drug is sitting in <b>my place</b>. I try again and again, but I just <b>bounce off</b>. 😢',
  go(){let n=0;const hit=j=>()=>{n++;lab3d('✗ Blocked!',atpCenter());score('ATP blocked','× '+n);if(SURF)surfHit()};
   [0,1,2].forEach(j=>{const t0=j*3800;tween(t0+1500,k=>{const kk=Math.max(0,(k*(t0+1500)-t0)/1500);if(k*(t0+1500)>=t0)atpPlace(20-13*ease(kk),side(j))},hit(j));
     tween(t0+3300,k=>{const tt=k*(t0+3300);if(tt>=t0+1700){const kk=(tt-t0-1700)/1600;atpPlace(7+13*ease(kk),side(j))}})});
   atpPlace(20,side(0));score('ATP blocked','× 0')}},
 {s:9,who:'enzyme',at:()=>ligTop(),say:'ATP cannot reach my active site, so I <b>cannot do my reaction</b>. I am <b>blocked</b> 🚫 Imatinib is an <b>enzyme inhibitor</b>. That is how the drug works! 💊',go(){atpPlace(16,side(1));score('Enzyme','Inhibited 🚫')}},
 {s:8,who:'nam',at:null,say:'That is real <b>computational chemistry</b> 🔬 Scientists dock drugs on a computer before making them in the lab. One day, this could be <b>your</b> job!',go(){score();spinY('y',.5)}}];
/* set the whole scene for beat i, so any beat can be shown at any time */
function scene(i){V.spin(false);V.removeAllLabels();V.removeAllShapes();if(gridM){V.removeModel(gridM);gridM=null}setXray(false);score();
  const whole=i<=1||i===BEATS.length-1;
  if(SURF){rec.setStyle({},{});if(whole){V.zoomTo();facePocket(1.15)}else{V.zoomTo(pocket());facePocket(.7)}
    surfState(i<=6?'idle':i===11||i===12?'off':'blocked');surfGlass(i>=3&&i<=6);if(i===9)rec.setStyle(pocket(),{})}
  else if(whole){rec.setStyle({},{cartoon:{color:'spectrum'}});home()}
  else{rec.setStyle({},{cartoon:{color:'spectrum',opacity:.55}});rec.setStyle(pocket(),{cartoon:{color:'spectrum',opacity:.55},stick:{radius:.09,colorscheme:'whiteCarbon'}});
    if(!pocketView){const m=$('mol');V.zoomTo(pocket());V.rotate(28,'y');V.rotate(-18,'x');V.zoom(m.clientWidth<m.clientHeight*.9?.5:.7);pocketView=V.getView()}else V.setView(pocketView)}
  if(i>=3&&i<=7)showBox(true);
  if(i<=3)lig.setStyle({},{});else if(i===4)lig.setStyle({},{});else if(i<=7)setLig(PS[[3,2,1][i-5]]);else{setLig(PS[0]);if(i===BEATS.length-1&&!SURF)lig.setStyle({},{sphere:{colorscheme:'orangeCarbon'}})}
  if(i===8)setXray(true);
  if(i===9)hbonds(true);
  if(i===2||i===10||i===11)atpPlace(20);else atpHide()}
/* ---------- progress UI ---------- */
function buildProg(){$('prog').innerHTML=BEATS.map((_,i)=>`<i data-i="${i}"><u></u></i>`).join('');[...$('prog').children].forEach(el=>el.onclick=()=>jump(+el.dataset.i))}
function jump(i){tw=[];beat=(i+BEATS.length)%BEATS.length;beatT0=T;scene(beat);const b=BEATS[beat];if(b.go)b.go();say(b);V.render();
  [...$('prog').children].forEach((el,k)=>el.firstChild.style.width=k<beat?'100%':'0');$('cap').textContent=(beat+1)+' / '+BEATS.length}
function next(){jump(beat+1)}
function say(b){const bub=$('bub'),w=WHO[b.who];
  $('who').innerHTML=(w[0]==='img'?'<img src="../../img/drnam-48.png" alt="">':'<i>'+w[0]+'</i>')+`<span style="color:${w[2]}">${w[1]}</span>`;
  $('say').innerHTML=b.say;anchor=b.at;bub.classList.remove('pop');void bub.offsetWidth;bub.classList.add('on','pop');bubY=null}
let bubY=null;
function placeBubble(){const bub=$('bub'),dot=$('dot'),view=bub.parentElement,m=$('mol'),VW=view.clientWidth,VH=view.clientHeight,bh=bub.offsetHeight,bw=bub.offsetWidth;
  const ox=m.offsetLeft,oy=m.offsetTop,mw=m.clientWidth,mh=m.clientHeight,phone=ox<5;
  let ax=null,ay=null;if(anchor){const p=V.modelToScreen(anchor()),vr=view.getBoundingClientRect();ax=Math.max(ox+16,Math.min(ox+mw-16,p.x-vr.left-view.clientLeft));ay=Math.max(oy+16,Math.min(oy+mh-16,p.y-vr.top-view.clientTop))}
  let top;
  if(phone){top=Math.min(oy+mh+10,VH-bh-12)}
  else{const want=ay==null?(VH-bh)/2:ay-bh/2;top=Math.max(34,Math.min(VH-bh-12,want))}
  bubY=bubY==null?top:bubY+(top-bubY)*.15;bub.style.top=bubY+'px';
  if(ax==null){dot.classList.remove('on');$('wpath').setAttribute('d','');return}
  dot.style.left=ax+'px';dot.style.top=ay+'px';dot.classList.add('on');
  const bx=phone?bub.offsetLeft+bw/2:bub.offsetLeft+bw,by=phone?bubY:bubY+Math.min(bh-16,Math.max(16,ay-bubY));
  const mx=phone?bx:(bx+ax)/2,my=phone?(by+ay)/2:by;
  $('wpath').setAttribute('d',phone?`M${bx},${by} C${bx},${my} ${ax},${my} ${ax},${ay}`:`M${bx},${by} C${mx},${by} ${mx},${ay} ${ax},${ay}`)}
/* ---------- main loop ---------- */
let lastNow=performance.now();
function loop(){const now=performance.now();const dt=Math.min(100,now-lastNow)*speed;lastNow=now;
  if(D){if(playing){T+=dt;
      tw=tw.filter(t=>{const k=Math.min(1,(T-t.t0)/t.dur);t.fn(k);if(k>=1){t.done&&t.done();return false}return true});
      const b=BEATS[beat],k=Math.min(1,(T-beatT0)/(b.s*1000));$('prog').children[beat].firstChild.style.width=(k*100)+'%';
      if(k>=1)next()}
    V.render();placeBubble();if(SURF){const c=D.center,p=V.modelToScreen({x:c[0],y:c[1],z:c[2]}),vw=$('glow').parentElement.getBoundingClientRect();const g=$('glow');g.style.left=(p.x-vw.left)+'px';g.style.top=(p.y-vw.top)+'px'}}
  requestAnimationFrame(loop)}
$('bPlay').onclick=()=>{playing=!playing;$('bPlay').textContent=playing?'⏸ Pause':'▶ Play';if(!playing)V.spin(false);else if(beat<=1||beat===BEATS.length-1)spinY('y',.5)};
$('bAgain').onclick=()=>{playing=true;$('bPlay').textContent='⏸ Pause';jump(0)};
$('bPrev').onclick=()=>jump(beat-1);$('bNext').onclick=()=>jump(beat+1);
$('bSpd').onclick=()=>{speed=speed===1?1.5:speed===1.5?.5:1;$('bSpd').textContent=speed+'×'};
fetch('data/dock_1iep.json').then(r=>r.json()).then(d=>{D=d;PS=D.poses.map(p=>coords(p.sdf));
  V=$3Dmol.createViewer($('mol'),{backgroundColor:'#040d1c',antialias:true});rec=V.addModel(D.receptor,'pdb');lig=V.addModel(D.poses[0].sdf,'sdf');
  atpM=V.addModel(D.atp.sdf,'sdf');ATP0=coords(D.atp.sdf);OUT=D.atp.out;{const t=Math.abs(OUT[0])<.9?[1,0,0]:[0,1,0];const c=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];const n=v=>{const l=Math.hypot(...v);return v.map(x=>x/l)};U1=n(c(OUT,t));U2=n(c(OUT,U1))}atpHide();
  $('loading').remove();new ResizeObserver(()=>{V.resize();V.render()}).observe($('mol'));buildProg();
  requestAnimationFrame(()=>{V.resize();V.zoomTo();V.zoom(.95);initView=V.getView();(SURF?buildSurf():Promise.resolve()).then(()=>{window.__ready=1;jump(0);requestAnimationFrame(loop)})})}).catch(()=>{$('loading').textContent='Oops! Please try again.'});
addEventListener('keydown',e=>{const map={ArrowRight:'next',PageDown:'next',ArrowLeft:'prev',PageUp:'prev'};
  if(map[e.key]&&parent!==window){e.preventDefault();parent.postMessage({simkey:map[e.key]},'*')}
  if(e.key===' '){e.preventDefault();$('bPlay').click()}});
</script>
