qZO0w4AYAhcSAyBC2WMSZLs/wPT4I3vD+j5WwAAAABJRU5ErkJggg=="}, "items": ["Photosynthesis: 6CO<sub>2</sub> + 6H<sub>2</sub>O + energy → C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> + 6O<sub>2</sub>, ΔH ≈ +2800 kJ.", "Sunlight supplies the energy; it is stored in the bonds of glucose.", "It is exactly the reverse of respiration, so ΔH has the same size and the opposite sign.", "Decomposing CaCO<sub>3</sub> into CaO and CO<sub>2</sub> also absorbs heat: ΔH = +177.8 kJ."], "notes": "Photosynthesis figure from Ball 5.6. CaCO3 value matches EM."}, {"t": "eq", "sec": 1, "lo": "CR2-LO1", "title": "Thermochemical equations", "eq": "2H<sub>2</sub>(g) + O<sub>2</sub>(g) → 2H<sub>2</sub>O(ℓ) &nbsp; ΔH = −572 kJ", "legend": [["as written", "ΔH belongs to the equation as written: 2 mol H<sub>2</sub> react with 1 mol O<sub>2</sub> to give 2 mol H<sub>2</sub>O and release 572 kJ"], ["states", "states matter: making H<sub>2</sub>O(g) instead of H<sub>2</sub>O(ℓ) releases less heat"], ["scale", "halve the coefficients, halve ΔH: H<sub>2</sub> + ½O<sub>2</sub> → H<sub>2</sub>O(ℓ), ΔH = −286 kJ"], ["reverse", "reverse the equation, change the sign: 2H<sub>2</sub>O(ℓ) → 2H<sub>2</sub>(g) + O<sub>2</sub>(g), ΔH = +572 kJ"]], "note": "ΔH can be read as 'kJ per the moles shown in the equation', so it works like a mole ratio from Chemical Reactions I.", "notes": "Key idea: ΔH is a stoichiometric quantity."}, {"t": "bullets", "sec": 1, "lo": "CR2-LO1", "title": "Heat from a thermochemical equation", "items": ["<b>1.</b> Convert the given mass to moles (divide by the molar mass).", "<b>2.</b> Use the equation: ΔH is the heat for the number of moles shown by the coefficient.", "<b>3.</b> Heat = moles × (ΔH ÷ coefficient). Keep the sign: negative = released, positive = absorbed.", "<b>4.</b> State the answer in words: '... kJ of heat is released' or '... is absorbed'."], "side": {"h": "Road map", "body": "mass → moles → heat<br>g ÷ (g/mol) → mol × (kJ/mol) → kJ"}, "notes": "Same road map as mole–mass problems in CR1, with ΔH as the last conversion factor."}, {"t": "example", "sec": 1, "lo": "CR2-LO1", "title": "Example 1.1 · Burning methane", "q": "CH<sub>4</sub>(g) + 2O<sub>2</sub>(g) → CO<sub>2</sub>(g) + 2H<sub>2</sub>O(ℓ), ΔH = −890 kJ. How much heat is released when 24.0 g of CH<sub>4</sub> burns? (C = 12.01, H = 1.01)", "steps": ["Molar mass of CH<sub>4</sub> = 12.01 + 4(1.01) = 16.05 g/mol", "Moles of CH<sub>4</sub> = 24.0 g ÷ 16.05 g/mol = 1.50 mol", "The equation releases 890 kJ per 1 mol CH<sub>4</sub>: 1.50 mol × 890 kJ/mol = 1.33 × 10<sup>3</sup> kJ", "<b>1.33 × 10<sup>3</sup> kJ of heat is released</b> (ΔH negative, exothermic)."], "notes": "1.4953 × 890 = 1331 kJ; 3 s.f. from 24.0 g."}, {"t": "example", "sec": 1, "lo": "CR2-LO1", "title": "Example 1.2 · Reversing and scaling", "q": "N<sub>2</sub>(g) + O<sub>2</sub>(g) → 2NO(g), ΔH = +180.6 kJ. (a) What is ΔH for 2NO(g) → N<sub>2</sub>(g) + O<sub>2</sub>(g)? (b) How much heat is needed to make 1 mol of NO?", "steps": ["(a) Reversing the equation changes the sign: ΔH = <b>−180.6 kJ</b> (exothermic).", "(b) 180.6 kJ makes 2 mol NO, so 1 mol needs 180.6 ÷ 2 = <b>90.3 kJ</b>, absorbed.", "This endothermic reaction happens in hot car engines and lightning; NO contributes to air pollution."], "notes": "Reverse = change sign; scale = scale ΔH."}, {"t": "tryit", "sec": 1, "lo": "CR2-LO1", "title": "Try it · Energy from glucose", "q": "C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> + 6O<sub>2</sub> → 6CO<sub>2</sub> + 6H<sub>2</sub>O, ΔH = −2803 kJ. How much heat is released when the body oxidises 9.00 g of glucose? (C = 12.01, H = 1.01, O = 16.00)", "a": "Molar mass = 6(12.01) + 12(1.01) + 6(16.00) = 180.18 g/mol<br>Moles = 9.00 ÷ 180.18 = 0.0500 mol<br>Heat = 0.0500 × 2803 = <b>140 kJ released</b> (about 33 kcal, a few sweets' worth).", "notes": "140 kJ ÷ 4.184 = 33.5 kcal."}, {"t": "two", "sec": 1, "lo": "CR2-LO1", "title": "Pharmacy in your hand: cold packs and hot packs", "lead": "Instant packs used for sprains and muscle aches contain a solid and a pouch of water. Squeezing the pack lets them mix.", "cols": [{"h": "Cold pack · endothermic", "tone": "cold", "items": ["Ammonium nitrate dissolves: NH<sub>4</sub>NO<sub>3</sub>(s) → NH<sub>4</sub><sup>+</sup>(aq) + NO<sub>3</sub><sup>−</sup>(aq)", "ΔH = +25.7 kJ/mol: heat is taken from the surroundings", "The pack (and the injury) cools down: reduces swelling"]}, {"h": "Hot pack · exothermic", "tone": "heat", "items": ["Calcium chloride dissolves: CaCl<sub>2</sub>(s) → Ca<sup>2+</sup>(aq) + 2Cl<sup>−</sup>(aq)", "ΔH = −82.8 kJ/mol: heat is released to the surroundings", "Air-activated warmers use iron rusting: 4Fe + 3O<sub>2</sub> → 2Fe<sub>2</sub>O<sub>3</sub>, ΔH = −1648 kJ"]}], "notes": "Dissolving is a physical change but the same sign rules apply. Values are standard enthalpies of solution."}, {"t": "tryit", "sec": 1, "lo": "CR2-LO1", "title": "Try it · Inside a cold pack", "q": "A cold pack contains 40.0 g of NH<sub>4</sub>NO<sub>3</sub>. Dissolving it has ΔH = +25.7 kJ/mol. How much heat does the pack absorb? Is the process endothermic or exothermic? (N = 14.01, H = 1.01, O = 16.00)", "a": "Molar mass = 2(14.01) + 4(1.01) + 3(16.00) = 80.06 g/mol<br>Moles = 40.0 ÷ 80.06 = 0.500 mol<br>Heat = 0.500 × 25.7 = <b>12.8 kJ absorbed</b>. ΔH is positive, so it is <b>endothermic</b>.", "notes": "0.49963 × 25.7 = 12.84 kJ."}, {"t": "bullets", "sec": 1, "lo": "CR2-LO1", "title": "Key takeaways: energy changes", "items": ["Bond breaking absorbs energy; bond forming releases energy. The balance decides the sign of ΔH.", "Exothermic: ΔH &lt; 0, heat released, surroundings warm. Endothermic: ΔH &gt; 0, heat absorbed, surroundings cool.", "ΔH in a thermochemical equation refers to the moles shown. Reverse the equation: change the sign. Scale the equation: scale ΔH.", "Heat = moles × (ΔH per mole): the same road map as stoichiometry."], "notes": "Summary of Part 1."}, {"t": "check", "sec": 1, "lo": "CR2-LO1", "title": "Quick check", "q": "2H<sub>2</sub>(g) + O<sub>2</sub>(g) → 2H<sub>2</sub>O(ℓ), ΔH = −572 kJ. What is ΔH for 4H<sub>2</sub>O(ℓ) → 4H<sub>2</sub>(g) + 2O<sub>2</sub>(g)?", "opts": ["−1144 kJ", "+572 kJ", "+1144 kJ", "−286 kJ"], "ans": 2, "why": "Reversing changes the sign (+572 kJ) and doubling the coefficients doubles ΔH: +1144 kJ."}, {"t": "divider", "num": 2, "title": "Energy diagrams and activation energy", "lo": "CR2-LO2", "src": "Ball 6.S", "blurb": "Even a reaction that releases energy must first climb an energy hill.", "notes": "Part 2 extends the uphill/downhill diagrams from EM by adding the activation energy barrier."}, {"t": "figure", "pos": "left", "sec": 2, "lo": "CR2-LO2", "title": "If it releases energy, why doesn't it just happen?", "fig": {"src": "hindenburg", "cap": "Hydrogen in the Hindenburg reacting with oxygen to form water, Figure 5.2.1 (Ball, The Basics of GOB Chemistry 5.2)", "h": 270, "data": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAa8AAAEBCAIAAABAH73IAAEAAElEQVR4nLz9WZMkyXUeDLt7RO77Vll7d/XePT0rQYAiBVFGk8n0fTekmX6WLvUTdKHvfU3ShS5FyQCBBDEiQAAzg+mZXmvfsnLflwj37+JJP3UiIqu6AVIMG+vJyozw8O08fvYjF4uF7/tCCCGElBIfjDHGGP4NPvAbxK0X3UDtmOC1/FUG7g81S3fSv958EWoBjWMIxhitNW/BcRy6E33wfd/3/fl8jrHgEWOMUkop5bpuaAj8XymlUgrteJ7neR61oLX2PM/3fc/zAgO0v+It9FJqFh88z6MZxitottFn3KaUchzHcRy0hl/pZnSM95naD03L9Ril0FpLKWOxmJQStzmOI6X0PG8+n9Orl3NoBHVMa43xaq1ns5lSajKZLBaLWCzmed50OpVSJhKJO3fupNPp4XColMpms+l0OpFIoNtKKbx3Npv1+/3RaIQ+XF1dzWazarUqhGg2m/P5PJ1Ou647HA6TyWQ2m8UyNRqNbrebzWaLxWI+n08mk6PR6ODg4ODgYHt7++7du1988cVsNvv1r3+ttY7FYq9evTo9PX306NFf/dVfoXuu6y4Wi1ar1e12Ly4ujDFXV1etVqvT6RwdHSUSiT/5kz/5t//23woh/uN//I/tdvsv//Iv9/b2CoXCxsbGxcXFycnJbDa7c+fOvXv3Dg8P/+f//J/9fj+TyVQqlXK5nE6nHcfBFB0dHW1sbNRqNa31YDAwxqRSqWQymclkptNpv99PJBLFYvHq6uro6MgY02q1Tk5OisXiZ599Zoz58ssvf/3rX3c6nUajsba2Vq1WB4PB4eGh7/vVajWdTqPzhULB931M+3Q6TSQSsVhssVgsFgtjjOM48Xg8Fos5jjMej7F7fd/XWqfT6VgsNhqNcrkcbS38FIvFkskkPjuOk0gk4vG44zi05eLxuOu62Dn0azweT6fTyWRyPp8Ph0Pf99PpdDabTaVS2MBYfdd10dRiscBmSCQS2N54YyqV4sToOE4sFnNdl9OpZFcsE y, the slower the reaction rate.'"}, {"t": "example", "sec": 2, "lo": "CR2-LO2", "title": "Example 2.1 · Values from a diagram", "q": "On an energy diagram, the reactants are at 50 kJ, the transition state at 150 kJ and the products at 20 kJ. Find E<sub>a</sub> (forward), ΔH and E<sub>a</sub> (reverse). Is the reaction exothermic or endothermic?", "steps": ["E<sub>a</sub>(forward) = 150 − 50 = <b>100 kJ</b>", "ΔH = 20 − 50 = <b>−30 kJ</b>: products are lower, so the reaction is <b>exothermic</b>", "E<sub>a</sub>(reverse) = 150 − 20 = <b>130 kJ</b> (check: 100 − (−30) = 130 kJ)"], "notes": "Encourage students to sketch the diagram before calculating."}, {"t": "tryit", "sec": 2, "lo": "CR2-LO2", "title": "Try it · Values from a diagram", "q": "Reactants 30 kJ, transition state 120 kJ, products 80 kJ. Find E<sub>a</sub> (forward), ΔH and E<sub>a</sub> (reverse), and classify the reaction. Then sketch the diagram.", "a": "E<sub>a</sub>(forward) = 120 − 30 = <b>90 kJ</b><br>ΔH = 80 − 30 = <b>+50 kJ</b>: <b>endothermic</b><br>E<sub>a</sub>(reverse) = 120 − 80 = <b>40 kJ</b>", "notes": "Uphill diagram with a peak at 120."}, {"t": "check", "sec": 2, "lo": "CR2-LO2", "title": "Quick check", "q": "On an energy diagram, what does the height from the reactants up to the peak represent?", "opts": ["ΔH of the reaction", "The activation energy, E<sub>a</sub>", "The energy of the products", "The rate of the reaction"], "ans": 1, "why": "E<sub>a</sub> is measured from the reactants to the transition state at the top of the hill."}, {"t": "divider", "num": 3, "title": "Collision theory", "lo": "CR2-LO3", "src": "Ball 6.S", "blurb": "Particles have to meet, hard enough and the right way round, before they can react.", "notes": "Core reference: 'Collision theory can be used to describe the energetic aspects of chemical reactions.'"}, {"t": "bullets", "sec": 3, "lo": "CR2-LO3", "title": "The three conditions of collision theory", "items": ["<b>1. Collide.</b> Reactant particles must come into contact: no collision, no reaction.", "<b>2. With enough energy.</b> The collision must supply at least E<sub>a</sub> to start breaking bonds.", "<b>3. In the right orientation.</b> The reacting parts of the particles must meet.", "A collision that meets all three is an <b>effective collision</b> and forms products. Any other collision is <b>ineffective</b>: the particles bounce apart unchanged."], "side": {"h": "Scale", "body": "In a gas at room temperature, each molecule collides billions of times per second. If every collision worked, every reaction would be instant."}, "notes": "Ask: if collisions are so frequent, why are many reactions slow? Answer: most collisions are ineffective."}, {"t": "figure", "pos": "top", "sec": 3, "lo": "CR2-LO3", "title": "Effective and ineffective collisions", "fig": {"src": "fig:collide", "cap": "NO + O<sub>3</sub> → NO<sub>2</sub> + O<sub>2</sub>: only one of these three collisions reacts (drawn by Dr. NAM)", "h": 250, "data": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NDAgMzkwIiB3aWR0aD0iNjQwIiBoZWlnaHQ9IjM5MCIgZm9udC1mYW1pbHk9IkhlbHZldGljYSwgQXJpYWwsIHNhbnMtc2VyaWYiPjxyZWN0IHdpZHRoPSI2NDAiIGhlaWdodD0iMzkwIiBmaWxsPSIjZmZmZmZmIi8+PGRlZnM+PG1hcmtlciBpZD0iYWgiIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wLDAgTDEwLDUgTDAsMTAgeiIgZmlsbD0iIzFCMkE0MSIvPjwvbWFya2VyPjxtYXJrZXIgaWQ9ImFoYyIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAsMCBMMTAsNSBMMCwxMCB6IiBmaWxsPSIjMkY2RjlGIi8+PC9tYXJrZXI+PG1hcmtlciBpZD0iYWhoIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0by1zdGFydC1yZXZlcnNlIj48cGF0aCBkPSJNMCwwIEwxMCw1IEwwLDEwIHoiIGZpbGw9IiNCODZFMDAiLz48L21hcmtlcj48bWFya2VyIGlkPSJhaGciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmW otes": "Always name the factor AND the collision-theory reason; that is where exam marks are."}, {"t": "table", "sec": 4, "lo": "CR2-LO4", "title": "Pharmacy focus: why medicines expire", "lead": "Drugs slowly react (degrade) in the pack. Storage instructions are reaction-rate chemistry.", "head": ["Instruction on the label", "What it slows down", "Rate factor"], "rows": [["'Store below 25 °C' · 'Refrigerate at 2–8 °C' (insulin, many vaccines)", "all degradation reactions", "temperature"], ["'Keep the container tightly closed' · desiccant sachets", "hydrolysis by moisture, e.g. aspirin → salicylic acid + acetic acid (a vinegar smell means it has degraded)", "concentration of water"], ["Amber bottles · 'protect from light'", "light-driven breakdown (photodegradation)", "energy supplied by light"], ["Expiry date", "the time until too much drug has broken down to be safe and effective", "overall rate"]], "widths": [2.2, 2.6, 1.2], "caption": "Expiry dates come from stability testing: manufacturers measure how fast the drug degrades under set conditions.", "notes": "Good place to connect to the pharmacy profession: correct storage protects patients."}, {"t": "tryit", "sec": 4, "lo": "CR2-LO4", "title": "Try it · On the ward", "q": "A patient keeps an opened bottle of aspirin tablets in a hot, steamy bathroom. Name two factors that will speed up the breakdown of the aspirin, and explain each using collision theory.", "a": "<b>Temperature</b>: in the warm room, molecules move faster, collide more often and more collisions have energy ≥ E<sub>a</sub>.<br><b>Moisture (concentration of water)</b>: steam increases the water available to react with aspirin (hydrolysis), so collisions between aspirin and water are more frequent.<br>Advice: store in a cool, dry place with the lid closed.", "notes": "Model answer names the factor and gives the collision reason."}, {"t": "bullets", "sec": 4, "lo": "CR2-LO4", "title": "Key takeaways: reaction rates", "items": ["Rate = change in concentration ÷ time; it is fastest at the start.", "Higher concentration and larger surface area → more collisions per second → faster.", "Higher temperature → more collisions and a larger fraction with energy ≥ E<sub>a</sub> → much faster.", "Storage instructions (cool, dry, dark, closed) slow the reactions that degrade medicines."], "notes": "Summary of Part 4."}, {"t": "check", "sec": 4, "lo": "CR2-LO4", "title": "Quick check", "q": "Why does raising the temperature increase the rate of a reaction?", "opts": ["It lowers the activation energy", "It increases the fraction of collisions with energy ≥ E<sub>a</sub>", "It changes ΔH from positive to negative", "It increases the number of reactant particles"], "ans": 1, "why": "Temperature does not change E<sub>a</sub> or ΔH. It gives more particles enough energy, and they also collide more often."}, {"t": "divider", "num": 5, "title": "Catalysts and enzymes", "lo": "CR2-LO5", "src": "Ball 6.S", "blurb": "A catalyst opens an easier path over the energy hill and comes out unchanged.", "notes": "Core reference: 'Catalysts can be added to reactions to lower the activation energy and increase the reaction rate.'"}, {"t": "figure", "pos": "leftwide", "sec": 5, "lo": "CR2-LO5", "title": "How a catalyst works", "fig": {"src": "fig:ed_cat", "cap": "A catalyst provides a pathway with a lower activation energy (drawn by Dr. NAM)", "h": 330, "data": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NDAgNDAwIiB3aWR0aD0iNjQwIiBoZWlnaHQ9IjQwMCIgZm9udC1mYW1pbHk9IkhlbHZldGljYSwgQXJpYWwsIHNhbnMtc2VyaWYiPjxyZWN0IHdpZHRoPSI2NDAiIGhlaWdodD0iNDAwIiBmaWxsPSIjZmZmZmZmIi8+PGRlZnM+PG1hcmtlciBpZD0iYWgiIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wLDAgTDEwLDUgTDAsMTAgeiIgZmlsbD0iIzFCMkE0MSIvPjwvbWFya2VyPjxtYXJrZXIgaWQ9ImFoYyIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbW lain.", "a": "<b>No.</b> A catalyst lowers E<sub>a</sub> only. ΔH stays the same, so the heat released is unchanged. It speeds up the forward and reverse reactions equally, so the final amount of product (the equilibrium position, Part 6) is unchanged. The product simply forms <b>faster</b>.", "notes": "Common misconception."}, {"t": "check", "sec": 5, "lo": "CR2-LO5", "title": "Quick check", "q": "Which statement about catalysts is correct?", "opts": ["They are used up in the reaction", "They make ΔH more negative", "They provide a pathway with a lower activation energy", "They only work at high temperature"], "ans": 2, "why": "A catalyst lowers E<sub>a</sub> and is recovered unchanged; ΔH is not affected. Enzymes work at body temperature."}, {"t": "divider", "num": 6, "title": "Equilibrium and Le Châtelier's principle", "lo": "CR2-LO6", "src": "Ball 6.S", "blurb": "Some reactions go both ways at once, and settle into a balance that can be pushed.", "notes": "Core reference summary: forward and reverse reactions, equilibrium, Le Chatelier's principle. Leads into Acids and Bases."}, {"t": "bullets", "sec": 6, "lo": "CR2-LO6", "title": "Reversible reactions", "items": ["Not all reactions go to completion. In a <b>reversible reaction</b>, products can react to re-form the reactants.", "We use a double arrow: N<sub>2</sub>(g) + 3H<sub>2</sub>(g) ⇌ 2NH<sub>3</sub>(g). Left to right is the <b>forward</b> reaction; right to left is the <b>reverse</b> reaction.", "Carbon dioxide in water: CO<sub>2</sub>(aq) + H<sub>2</sub>O(ℓ) ⇌ H<sub>2</sub>CO<sub>3</sub>(aq), in fizzy drinks and in our blood.", "Oxygen transport: haemoglobin + O<sub>2</sub> ⇌ oxyhaemoglobin."], "side": {"h": "Coming next", "body": "Acids and bases, later in this course, are full of equilibria, such as the dissociation of water and buffers."}, "notes": "Haber process for ammonia is the classic industrial example."}, {"t": "figure", "pos": "top", "sec": 6, "lo": "CR2-LO6", "title": "Reaching dynamic equili oors: push more people in through one door and more leave through the other until the flow balances again."}, "notes": "Core reference: 'Le Chatelier's principle states that the direction of an equilibrium reaction will shift to reduce the stress.'"}, {"t": "table", "sec": 6, "lo": "CR2-LO6", "title": "Predicting the shift", "head": ["Stress", "The system responds by", "Shift"], "rows": [["Add a reactant / remove a product", "using up the added reactant / replacing the product", "right →"], ["Add a product / remove a reactant", "using up the added product", "← left"], ["Raise the temperature", "absorbing heat: favours the endothermic direction", "exothermic forward: ← left<br>endothermic forward: right →"], ["Increase pressure (gases)", "reducing the number of gas molecules", "towards fewer moles of gas"], ["Add a catalyst", "reaching equilibrium faster", "no shift"]], "widths": [1.8, 2.6, 1.6], "caption": "Concentration and pressure changes move the position of equilibrium without changing the equilibrium constant, K; a temperature change does change K. You will meet K in later courses.", "notes": "Students should be able to give the direction AND the reason."}, {"t": "example", "sec": 6, "lo": "CR2-LO6", "title": "Example 6.1 · Making ammonia", "q": "N<sub>2</sub>(g) + 3H<sub>2</sub>(g) ⇌ 2NH<sub>3</sub>(g), ΔH = −92 kJ. Predict the shift when: (a) N<sub>2</sub> is added; (b) NH<sub>3</sub> is removed; (c) the temperature is raised; (d) the pressure is increased; (e) an iron catalyst is added.", "steps": ["(a) <b>Right</b>: the system uses up the added N<sub>2</sub>.", "(b) <b>Right</b>: the system replaces the NH<sub>3</sub> removed.", "(c) <b>Left</b>: the forward reaction is exothermic (heat is a product); adding heat favours the reverse reaction.", "(d) <b>Right</b>: 4 mol of gas on the left, 2 mol on the right; higher pressure favours fewer gas molecules.", "(e) <b>No shift</b>: equilibrium is reached faster."], "notes": "The industrial compromise: moderate temperature (for rate) with a catalyst and high pressure."}, {"t": "two", "sec": 6, "lo": "CR2-LO6", "title": "Equilibrium in the body: oxygen transport", "lead": "Hb + O<sub>2</sub> ⇌ HbO<sub>2</sub> (haemoglobin + oxygen ⇌ oxyhaemoglobin)", "cols": [{"h": "In the lungs", "tone": "cold", "items": ["O<sub>2</sub> concentration is high", "Le Châtelier: the equilibrium shifts <b>right</b>", "Haemoglobin loads up with oxygen"]}, {"h": "In the tissues", "tone": "heat", "items": ["Cells use O<sub>2</sub>, so its concentration is low", "The equilibrium shifts <b>left</b>", "Oxyhaemoglobin releases oxygen where it is needed"]}], "notes": "Carbon monoxide poisoning: CO binds haemoglobin much more strongly than O2, so oxygen cannot be loaded."}, {"t": "tryit", "sec": 6, "lo": "CR2-LO6", "title": "Try it · Opening a fizzy drink", "q": "In a sealed bottle: CO<sub>2</sub>(g) ⇌ CO<sub>2</sub>(aq). Dissolving CO<sub>2</sub> is exothermic. Use Le Châtelier's principle to explain (a) why the drink fizzes when opened and (b) why a warm drink goes flat faster.", "a": "(a) Opening the bottle lowers the pressure of CO<sub>2</sub> gas. The equilibrium shifts <b>left</b>, towards gas, to replace it: dissolved CO<sub>2</sub> comes out as bubbles.<br>(b) Dissolving is exothermic, so heat is a 'product'. Raising the temperature shifts the equilibrium <b>left</b>: less CO<sub>2</sub> stays dissolved.", "notes": "Also explains why carbonated drinks are bottled under pressure and served cold."}, {"t": "bullets", "sec": 6, "lo": "CR2-LO6", "title": "Key takeaways: equilibrium", "items": ["In a reversible reaction, forward and reverse reactions run at the same time.", "At dynamic equilibrium, the two rates are equal and the concentrations stay constant (not necessarily equal).", "Le Châtelier: a stressed equilibrium shifts to reduce the stress (concentration, temperature, gas pressure).", "A catalyst helps equilibrium arrive sooner but does not move it."], "notes": "Summary of Part 6."}, {"t": "check", "sec": 6, "lo": "CR2-LO6", "title": "Quick check", "q": "Which statement about a system at dynamic equilibrium is correct?", "opts": ["The forward and reverse reactions have stopped", "The concentrations of reactants and products are always equal", "The forward and reverse rates are equal", "Adding a catalyst shifts it to the right"], "ans": 2, "why": "Both reactions continue at equal rates, so concentrations stay constant (not necessarily equal). A catalyst does not shift equilibrium."}, {"t": "summary", "title": "Summary: key rules", "rows": [["Energy change", "ΔH &lt; 0 exothermic (heat out) · ΔH &gt; 0 endothermic (heat in)"], ["Thermochemistry", "heat = mol × ΔH per mol · reverse → change sign · double → double ΔH"], ["Energy diagram", "E<sub>a</sub> = peak − reactants; ΔH = products − reactants"], ["Collision theory", "collide + energy ≥ E<sub>a</sub> + right orientation = effective"], ["Rate factors", "↑ concentration · ↑ temperature · ↑ surface area · catalyst"], ["Catalysts", "lower E<sub>a</sub> · not used up · ΔH and equilibrium unchanged"], ["Le Châtelier", "shifts to reduce the stress · catalyst: no shift"]], "notes": "These rules are the basis of the tutorial and exam questions."}, {"t": "close", "title": "Before the next topic", "items": ["Do the <b>After class</b> activity in the Study Hub (about 25 minutes).", "Try the <b>Tutorial</b>: exam-style questions with full worked solutions.", "Next topic: <b>Solution</b>: solubility, concentration, dilution and osmosis."], "attrib": "Core reference: <i>The Basics of GOB Chemistry</i> (Ball, Hill &amp; Scott), LibreTexts, CC BY-NC-SA 3.0: sections 5.2 and 5.6 (photographs), 6.S (chapter summary) and 7.4 (bond energies). Rates and equilibrium are expanded to match <i>Introductory Chemistry</i> (LibreTexts), chapter 15. Diagrams drawn by Dr. NAM. Shared under the same licence for non-commercial teaching.", "notes": "Point students to the Study Hub."}];

 table:d=>{const side=d.note&&d.head.length<=4;return `<div class="slide">${head(d)}<div class="body tb">${d.lead?`<p class="lead">${d.lead}</p>`:''}<div class="row2" style="${side?'':'grid-template-columns:1fr'}"><div>${tbl(d.head,d.rows,d.widths)}${!side&&d.note?`<p style="font-size:.85em;margin:10px 0 0">${d.note}</p>`:''}${d.caption?`<p class="cap">${d.caption}</p>`:''}</div>${side?`<div class="notebox"><h4>Note</h4>${d.note}</div>`:''}</div></div>${foot}</div>`},
 eq:d=>`<div class="slide">${head(d)}<div class="body tb"><div class="eqbox">${d.eq}</div><table class="leg">${d.legend.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table>${d.note?`<p class="cap" style="font-size:.75em">${d.note}</p>`:''}</div>${foot}</div>`,
 example:d=>`<div class="slide">${head(d)}<div class="body"><div class="card q" style="font-size:1.05em">${d.q}</div><div class="steps">${d.steps.map((s,k)=>`<div class="step frag${k==d.steps.length-1?' last':''}" data-f="${k+1}" style="font-size:1.05em"><i>${k+1}</i><div>${s}</div></div>`).join('')}</div><p class="tap">Try it first. Press → to reveal each step.</p></div>${foot}</div>`,
 tryit:d=>`<div class="slide">${head(d)}<div class="body"><div class="card q" style="font-size:1.05em">${d.q}</div><div class="tryans frag" data-f="1"><b style="color:var(--heat)">Answer</b><br>${d.a}${d.afig?`<img src="${d.afig.data}" alt="" style="display:block;max-width:100%;max-height:170px;margin-top:10px;background:#fff;border-radius:8px">`:''}</div><p class="tap">Work it out, then press → to check.</p></div>${foot}</div>`,
 check:d=>`<div class="slide" data-check>${head(d)}<p class="q" style="font-weight:500;margin-top:-6px">${d.q}</p><div class="opts">${d.opts.map((o,j)=>`<button class="opt" data-j="${j}" data-a="${d.ans}"><b>${String.fromCharCode(65+j)}</b>${o}</button>`).join('')}</div><div class="why" hidden>${d.why}</div>${foot}</div>`,
 curve:d=>`<div class="slide">${head(d)}<div class="body"><div class="row2" style="grid-template-columns:1fr 1fr"><ul class="pts" style="margin:0;font-size:1em">${d.items.map(p=>`<li>${p}</li>`).join('')}</ul><div>${curve(false)}</div></div></div>${foot}</div>`,
 summary:d=>`<div class="slide">${head(d)}<div class="sum">${d.rows.map(([a,b])=>`<div><b>${a}</b><span>${b}</span></div>`).join('')}</div>${foot}</div>`,
 close:d=>`<div class="slide dark"><h2 style="color:#fff;margin-top:20px">${d.title}</h2><ul class="close" style="padding:0">${d.items.map((t,i)=>`<li><i>${i+1}</i>${t}</li>`).join('')}</ul><div class="attrib">${d.attrib}</div>${foot}</div>`,
};
const R0=Object.assign({},R);
const figH=(f,cls='')=>f?`<figure class="vis ${cls}" style="margin:0"><img src="${f.data}" alt="${(f.cap||'').replace(/<[^>]+>/g,'').replace(/"/g,'')}" ${f.h?`style="height:${f.h}px;max-height:${f.h}px;width:auto;max-width:100%"`:''}>${f.cap?`<figcaption>${f.cap}</figcaption>`:''}</figure>`:'';
const pts=items=>`<ul class="pts" style="margin:0">${items.map(p=>`<li>${p}</li>`).join('')}</ul>`;
R.bullets=d=>d.fig?`<div class="slide">${head(d)}<div class="body"><div class="gv g-fr">${pts(d.items)}${figH(d.fig)}</div></div>${foot}</div>`:R0.bullets(d);
R.figure=d=>`<div class="slide">${head(d)}<div class="body">${d.pos==='top'?`${figH(d.fig,'figtop')}<div style="margin-top:14px">${pts(d.items)}</div>`:`<div class="gv ${d.pos==='leftwide'?'g-flw':'g-fl'}">${figH(d.fig)}${pts(d.items)}</div>`}</div>${foot}</div>`;
R.chart=d=>`<div class="slide">${head(d)}<div class="body"><div class="gv g-ch"><div>${d.chartsvg}</div>${pts(d.items)}</div></div>${foot}</div>`;
R.table=d=>{if(!(d.fig||d.chart))return R0.table(d);const t=`<div>${tbl(d.head,d.rows,d.widths)}${d.caption?`<p class="cap">${d.caption}</p>`:''}</div>`;const v=d.chart?`<div>${d.chartsvg}</div>`:figH(d.fig);
 return `<div class="slide">${head(d)}<div class="body tb">${d.lead?`<p class="lead">${d.lead}</p>`:''}<div class="gv ${d.figpos==='left'?'g-fl':'g-fr'}">${d.figpos==='left'?v+t:t+v}</div></div>${foot}</div>`};
R.tiles=d=>d.fig?`<div class="slide">${head(d)}<div class="body">${d.lead?`<p class="lead">${d.lead}</p>`:''}${figH(d.fig,'tilesfig')}<div class="tiles3" style="margin-top:12px">${d.tiles.map(t=>`<div class="tile" style="background:${TONE[t.tone][0]};min-height:0"><h3 style="color:${TONE[t.tone][1]};font-size:24px">${t.h}</h3>${t.body.replace(/<br><br>/g,'<br>')}</div>`).join('')}</div></div>${foot}</div>`:R0.tiles(d);
R.two=d=>`<div class="slide">${head(d)}<div class="body">${d.lead?`<p class="lead">${d.lead}</p>`:''}<div class="colsx">${d.cols.map(c=>`<div class="tile" style="background:${TONE[c.tone][0]}"><h3 style="color:${TONE[c.tone][1]}">${c.h}</h3><ul>${c.items.map(i=>`<li>${i}</li>`).join('')}</ul>${c.imgdata?`<img class="timg" src="${c.imgdata}" alt="">`:''}</div>`).join('')}</div></div>${foot}</div>`;
R.example=d=>{const st=`<div class="steps">${d.steps.map((s,k)=>`<div class="step frag${k==d.steps.length-1?' last':''}" data-f="${k+1}" style="font-size:1.05em"><i>${k+1}</i><div>${s}</div></div>`).join('')}</div>`;
 return `<div class="slide">${head(d)}<div class="body"><div class="card q" style="font-size:1.05em">${d.q}</div>${d.fig?`<div class="gv g-fr" style="margin-top:6px">${st}${figH(d.fig)}</div>`:st}<p class="tap">Try it first. Press → to reveal each step.</p></div>${foot}</div>`};

R.tryit=d=>`<div class="slide">${head(d)}<div class="body">${d.qfig?`<div class="tq"><div class="card q" style="font-size:1.05em">${d.q}</div><img src="${d.qfig.data}" alt="" style="${d.qfig.h?`height:${d.qfig.h}px;max-height:none;width:auto`:""}"></div>`:`<div class="card q" style="font-size:1.05em">${d.q}</div>`}<div class="tryans frag" data-f="1"><b style="color:var(--heat)">Answer</b><br>${d.a}${d.afig?`<img src="${d.afig.data}" alt="" style="display:block;max-width:100%;max-height:170px;margin-top:10px;background:#fff;border-radius:8px">`:''}</div><p class="tap">Work it out, then press → to check.</p></div>${foot}</div>`;
R.shapes3d=d=>`<div class="slide">${head(d)}<div class="body"><div class="s3">${d.tiles.map(t=>`<div class="t"><h3>${t.h}</h3><img class="m3fb" src="${t.data}" alt="${t.h}"><p>${t.b}</p></div>`).join('')}</div></div>${foot}</div>`;

const stage=document.getElementById('stage');
stage.innerHTML=S.map(d=>R[d.t](d)).join('');
const slides=[...stage.querySelectorAll('.slide')];
let cur=0,frag=0;
const store={get(k){try{return localStorage.getItem('phd115-cr2-deck-'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('phd115-cr2-deck-'+k,v)}catch(e){}}};
function nFrags(i){return slides[i].querySelectorAll('.frag').length}
function paint(){
 slides.forEach((s,i)=>s.classList.toggle('on',i===cur)); autofit(slides[cur]);
 slides[cur].querySelectorAll('.frag').forEach(f=>f.classList.toggle('show',+f.dataset.f<=frag));
 slides[cur].querySelectorAll('.ans.frag').forEach(f=>f.style.visibility=+f.dataset.f<=frag?'visible':'hidden');
 document.getElementById('bar').style.width=((cur+1)/slides.length*100)+'%';
 stage.classList.toggle('dk',slides[cur].classList.contains('dark')); molUpdate();
 document.getElementById('count').textContent=`${cur+1} / ${slides.length}`;
 document.getElementById('notes').textContent=S[cur].notes||'';
 store.set('cur',cur); history.replaceState(null,'','#'+(cur+1)); prog();
}

// ---- floating 3D molecules
const SEC=META.secmol;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;let R3=null;
function initMol(){try{if(!window.THREE||!window.MOL)return;if(Math.min(screen.width||9999,screen.height||9999)<600)return;const cv=document.createElement('canvas');cv.id='mol';stage.prepend(cv);
 const r=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio||1,1.5));r.setSize(1280,720,false);
 const cam=new THREE.OrthographicCamera(-640,640,360,-360,-2000,2000);const sc=new THREE.Scene();sc.add(new THREE.AmbientLight(0xffffff,.6));
 const dl=new THREE.DirectionalLight(0xffffff,.85);dl.position.set(-300,400,600);sc.add(dl);R3={r,cam,sc,items:[],t0:performance.now()};stage.classList.add('has3d');
 if(!RM)requestAnimationFrame(loop);}catch(e){R3=null}}
function layout(d,i){if(d.t==='shapes3d'){const cw=(1280-144-56)/5;return d.tiles.map((t,k)=>[t.mol,72+cw/2+k*(cw+14),430,t.mol==='co2'?64:(t.mol==='bf3'?70:80),1]);}const m=SEC[d.sec||d.num]||['water','ethanol'];
 if(d.t==='title'){const T=META.titlemol;return META.hero==='curve'?[[T[0],870,150,58,1],[T[1],1085,125,42,1],[T[2],1190,300,36,1],[T[3]||T[0],745,330,30,.9]]:[[T[0],1010,480,60,1],[T[1],1180,330,40,1],[T[2],820,380,34,1],[T[3]||T[1],740,600,28,.9]];}
 if(d.t==='divider')return[[m[0],1040,195,m[0]==='nacl'?52:62,1],[m[1]||m[0],1185,470,40,.95],[m[m.length>2?2:0],890,575,28,.85]];
 if(d.t==='hook'||d.t==='close')return[[META.darkmol,1085,95,META.darkmol==='nacl'?30:40,1],[(SEC[1]||['water'])[0],1190,330,30,.9]];
 const a=m[i%m.length],b=m[(i+1)%m.length];return[[a,1175,72,22,.95],[b,1300,430,78,.10]];}
function molUpdate(){if(!R3)return;R3.items.forEach(it=>{R3.sc.remove(it.g);it.g.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose()})});
 R3.items=layout(S[cur],cur).map(([n,x,y,sz,op])=>{const g=MOL.build(THREE,n,{opacity:op});g.scale.setScalar(sz);g.position.set(x-640,360-y,0);
  g.rotation.set(Math.random()*.8,Math.random()*6.28,0);R3.sc.add(g);return{g,x,y,ph:Math.random()*6.28,sp:.12+Math.random()*.18}});
 R3.r.render(R3.sc,R3.cam);}
function loop(t){if(R3&&!document.hidden){const s=(t-R3.t0)/1000;R3.items.forEach(it=>{it.g.rotation.y+=it.sp*0.016;it.g.rotation.x=Math.sin(s*.3+it.ph)*.35;
 it.g.position.y=360-it.y+Math.sin(s*.6+it.ph)*8;it.g.position.x=it.x-640+Math.cos(s*.4+it.ph)*5});R3.r.render(R3.sc,R3.cam)}requestAnimationFrame(loop)}

function autofit(s){const b=s.querySelector('.body');if(!b||b.dataset.fit)return;let f=1;b.style.setProperty('--fs',f);
 const over=()=>b.scrollHeight>b.clientHeight+2;
 while(over()&&f>0.62){f-=0.04;b.style.setProperty('--fs',f)} b.dataset.fit=1;}
function next(){if(frag<nFrags(cur)){frag++;paint();return}if(cur<slides.length-1){cur++;frag=0;paint()}}
function prev(){if(frag>0){frag--;paint();return}if(cur>0){cur--;frag=nFrags(cur);paint()}}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));frag=0;paint()}
const box=document.getElementById('box'),wrap=document.getElementById('wrap');
function fit(){let W=wrap.clientWidth||innerWidth,H=wrap.clientHeight;if(!H||H<60)H=innerHeight||W*9/16;const s=Math.max(0.1,Math.min(W/1280,H/720));box.style.width=(1280*s)+'px';box.style.height=(720*s)+'px';stage.style.transform='scale('+s+')'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));if(window.visualViewport)visualViewport.addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(wrap);fit();
let px=null,py=null;
stage.addEventListener('pointerdown',e=>{px=e.clientX;py=e.clientY});
stage.addEventListener('pointerup',e=>{if(px===null)return;const dx=e.clientX-px,dy=e.clientY-py;px=null;
 if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){dx<0?next():prev();return}
 const rb=e.target.closest('.retry');if(rb){resetCheck(rb.closest('.slide'));return}
 const o=e.target.closest('.opt');if(o){answer(o);return}
 const r=box.getBoundingClientRect();(e.clientX-r.left<r.width*0.3)?prev():next();});
stage.addEventListener('pointercancel',()=>{px=null});
function answer(o){
 const box=o.closest('.slide');if(box.dataset.done)return;box.dataset.done=1;
 const a=+o.dataset.a,j=+o.dataset.j,bs=box.querySelectorAll('.opt');
 o.classList.add(j===a?'right':'wrong');bs[a].classList.add('right');const w=box.querySelector('.why');w.hidden=false;
 if(!box.querySelector('.retry')){const r=document.createElement('button');r.className='retry';r.textContent='↺ Try again';w.after(r)}else box.querySelector('.retry').hidden=false;
 prog({checks:{[cur]:j===a}});
}
function resetCheck(box){delete box.dataset.done;box.querySelectorAll('.opt').forEach(b=>b.classList.remove('right','wrong'));box.querySelector('.why').hidden=true;const r=box.querySelector('.retry');if(r)r.hidden=true}
function prog(extra){try{const k='phd115:'+(META.code||'x').toLowerCase()+':slides';const o=JSON.parse(localStorage.getItem(k)||'{}');o.max=Math.max(o.max||0,cur+1);o.last=cur+1;o.total=slides.length;o.t=Date.now();
 if(extra&&extra.checks)o.checks=Object.assign(o.checks||{},extra.checks);localStorage.setItem(k,JSON.stringify(o));localStorage.setItem('phd115:last',JSON.stringify({topic:(META.code||'').toLowerCase(),act:'slides',t:Date.now()}))}catch(e){}}
addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next()}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
 else if(e.key==='n'||e.key==='N')toggleNotes();
 else if(e.key==='f'||e.key==='F')full();
 else if(e.key==='g'||e.key==='G'){const n=parseInt(prompt('Go to slide (1–'+slides.length+')'),10);if(n)go(n-1)}
 else if(/^[a-dA-D]$/.test(e.key)&&slides[cur].hasAttribute('data-check')){const b=slides[cur].querySelectorAll('.opt')['abcd'.indexOf(e.key.toLowerCase())];if(b)answer(b)}
 else if(e.key==='?')document.getElementById('help').hidden=false;
 else if(e.key==='Escape')document.getElementById('help').hidden=true;
});

function toggleNotes(){const n=document.getElementById('notes');n.hidden=!n.hidden}
function full(){const d=document.documentElement;if(!document.fullscreenElement){(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d)}else document.exitFullscreen()}
bPrev.onclick=prev;bNext.onclick=next;bNotes.onclick=toggleNotes;bFull.onclick=full;bHelp.onclick=()=>help.hidden=false;hClose.onclick=()=>help.hidden=true;
initMol();
const h=parseInt(location.hash.slice(1),10);cur=h?Math.min(h-1,slides.length-1):(+store.get('cur')||0);paint();
</script><script src="../../js/annotate.js"></script></body></html>
